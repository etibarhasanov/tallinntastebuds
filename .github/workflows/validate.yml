name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data:
    name: Check data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm install` step, and there never should be one:
      # tools/validate.mjs has no dependencies.
      - name: Validate data
        run: node tools/validate.mjs

      # The encoder that draws the discount QR. --check compares every fixture
      # against the matrix it drew when it was last scanned with a real camera
      # and skips the timing, which would only be noise on a shared runner.
      - name: Check the QR encoder
        run: node tools/qrperf.mjs --check
