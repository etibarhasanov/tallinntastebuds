name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data:
    name: Check data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm install` step, and there never should be one:
      # tools/validate.mjs has no dependencies.
      - name: Validate data
        run: node tools/validate.mjs
