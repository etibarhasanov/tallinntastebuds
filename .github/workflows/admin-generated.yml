name: admin-generated

# The half of an admin pull request the page cannot write.
#
# /admin.html's Add a place and Edit a place tabs write data/restaurants.json
# and the photographs through GitHub's Contents API, from the browser, and
# nothing else. Every file generated from restaurants.json is left as it was:
# the catalogue (data/places.json), the map's own copy and the write-ups one
# language to a file (data/map.json, data/lang/), sitemap.xml, and the one
# map_id line db/google-venues.sql gains for a place the Google export
# already lists. The validator holds each of those to what its tool would
# write, so every PR the page opened went red, and landing one meant a
# laptop: check the branch out, run the tools, commit, push. That step was
# written down in the /place skill and still got forgotten; the PR sat red
# and unmerged until somebody asked why.
#
# So it runs here instead, on every push to an admin/ branch and nowhere
# else. The tools are the same zero-dependency scripts a person would run, in
# the order the validator wants them (the sitemap reads restaurants.json, the
# Google SQL reads the catalogue's ids). It commits only when one of them
# changed something, so a push that was already caught up is a run that
# touches nothing.
#
# Two things about GitHub that the shape below answers:
#
#   - A push made with GITHUB_TOKEN starts no workflow, which is what stops
#     this triggering itself round and round, and also what would leave the
#     regenerated commit with no "Check data files" run of its own: the PR
#     shows checks for its head commit, and the red one belongs to the commit
#     before. workflow_dispatch is the one event GITHUB_TOKEN may start, so
#     the job dispatches validate.yml on the branch afterwards and the PR's
#     head gets its own check, green or red on its merits.
#   - The page pushes one commit per photo and then the entry, so several
#     runs can be queued for one branch. The concurrency group keeps one
#     running and only the newest waiting, and each run checks out the branch
#     as it is now rather than the commit that woke it. A push that loses a
#     race with the page rebases onto it and tries again; the newer commit has
#     its own run coming that regenerates from the newer entry.
#
# An admin/ branch never deploys — Pages watches only the production branch —
# so nothing here reaches the live site. The PR merging is still the yes.

on:
  push:
    branches:
      - 'admin/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: admin-generated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate what the admin page cannot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm install`, here or anywhere else in this repo.
      - name: Run the generators
        run: |
          node tools/places.mjs
          node tools/languages.mjs
          node tools/sitemap.mjs
          node tools/googlevenues.mjs

      - name: Commit what they changed
        id: commit
        run: |
          git add data/places.json data/map.json data/lang sitemap.xml db/google-venues.sql
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already caught up; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "The catalogue, the map and the sitemap catch up with restaurants.json" \
                     -m "Regenerated by the admin-generated workflow: tools/places.mjs, tools/languages.mjs, tools/sitemap.mjs and tools/googlevenues.mjs, the files /admin.html cannot write itself."
          pushed=false
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          if [ "$pushed" != true ]; then echo "Could not push after three tries."; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check the new head
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --ref "${GITHUB_REF_NAME}"
