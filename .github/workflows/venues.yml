name: venues

# Loads db/google-venues.sql — the Google Places export, as upserts — into the
# D1 database behind the site. See the Google venues section of README.md for
# what the file is and why every statement in it names its rows.
#
# The site itself is published by Cloudflare's own Git integration, so no
# workflow here holds a Pages token, and this one wants none: it needs a token
# that can write to D1 and nothing else.
#
# Setup, once:
#   1. Cloudflare dashboard -> Manage Account -> Account API Tokens -> Create
#      Token -> Create Custom Token, with one permission: Account / D1 / Edit.
#   2. Copy your Account ID from the right-hand sidebar of any Cloudflare page.
#   3. In GitHub: Settings -> Secrets and variables -> Actions -> New
#      repository secret, twice:
#         CLOUDFLARE_D1_TOKEN     the token from step 1
#         CLOUDFLARE_ACCOUNT_ID   the id from step 2
#
# Until both secrets exist this workflow passes and does nothing, so it will
# not sit red in the meantime.

on:
  # The file changed on the live branch: load it into the live database. The
  # path filter is the whole of the gate. Every row in the file is an upsert
  # and running it twice changes nothing, but it is a write to every row, so
  # it runs when the file moved and not on every commit.
  push:
    branches:
      - claude/tallinn-tastebuds-map-nzoqx0
    paths:
      - db/google-venues.sql
  # By hand, from the Actions tab, into whichever database you name. This is
  # how the preview database gets it, and how the live one gets it the first
  # time after the secrets are set.
  workflow_dispatch:
    inputs:
      database:
        description: Which D1 database to load
        type: choice
        options:
          - tallinntastebuds-preview
          - tallinntastebuds
        default: tallinntastebuds-preview

permissions:
  contents: read

jobs:
  load:
    name: Load the Google venues
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A push is only ever the live branch, so a push is the live database.
      DATABASE: ${{ inputs.database || 'tallinntastebuds' }}
    steps:
      - uses: actions/checkout@v4

      - name: Report missing configuration
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        run: |
          echo "::notice::Cloudflare secrets are not set yet, so nothing was loaded."
          echo "Add CLOUDFLARE_D1_TOKEN and CLOUDFLARE_ACCOUNT_ID under"
          echo "Settings -> Secrets and variables -> Actions, then re-run this workflow."

      - name: Load ${{ env.DATABASE }}
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute ${{ env.DATABASE }} --remote --file=db/google-venues.sql
