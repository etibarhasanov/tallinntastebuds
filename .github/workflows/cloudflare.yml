name: cloudflare

# Deploys to Cloudflare Pages from GitHub's runners, so nothing has to be
# wired up in the Cloudflare dashboard beyond creating an API token.
#
# Use EITHER this workflow OR Cloudflare's own "Connect to Git" integration,
# never both — two deploy paths racing each other on the same project produces
# confusing, out-of-order deployments.
#
# Setup, once:
#   1. Cloudflare dashboard -> Manage Account -> Account API Tokens -> Create
#      Token -> use the "Cloudflare Pages — Edit" template, and add
#      "D1 — Edit" to it: the last step below loads the Google venues into
#      the database, and a token scoped to Pages alone cannot.
#   2. Copy your Account ID from the right-hand sidebar of any Cloudflare page.
#   3. In GitHub: Settings -> Secrets and variables -> Actions -> New
#      repository secret, twice:
#         CLOUDFLARE_API_TOKEN   the token from step 1
#         CLOUDFLARE_ACCOUNT_ID  the id from step 2
#
# The token is scoped to Pages only and never leaves GitHub's secret store.
# Until both secrets exist this workflow passes and does nothing, so it will
# not sit red in the meantime.

on:
  push:
    branches:
      - main
      - claude/tallinn-tastebuds-map-nzoqx0
  workflow_dispatch:
  # The story cron calls this after it commits. A push made with the built-in
  # GITHUB_TOKEN deliberately does not start another workflow — that is how
  # GitHub stops a workflow from triggering itself round and round — so the
  # cron has to ask for the deploy by name, and hand over the commit it just
  # wrote, which is newer than the one it was itself started on.
  workflow_call:
    inputs:
      ref:
        description: The commit or branch to publish. Defaults to the one that started this run.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and publish
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: tallinntastebuds
      PROD_BRANCH: claude/tallinn-tastebuds-map-nzoqx0
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on a push or a manual run, which is checkout's own default.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Same gate as the validate workflow: broken data never reaches the
      # live site, whatever the deploy target.
      - name: Validate data
        run: node tools/validate.mjs

      - name: Report missing configuration
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        run: |
          echo "::notice::Cloudflare secrets are not set yet, so nothing was deployed."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under"
          echo "Settings -> Secrets and variables -> Actions, then re-run this workflow."

      # Creating a project that already exists is an error, and there is no
      # --if-not-exists flag, so the first run creates it and every later run
      # steps over the failure.
      - name: Ensure the Pages project exists
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create tallinntastebuds --production-branch=claude/tallinn-tastebuds-map-nzoqx0

      # Which of the two environments this lands in is decided by --branch: the
      # production branch is a production deployment and gets the production
      # D1 database, anything else is a preview deployment and gets
      # tallinntastebuds-preview. Both are declared in wrangler.toml, and the
      # validate step above refuses to let them become the same database.
      #
      # Each environment's configuration is written by a deployment of that
      # environment, so a change to the preview half of wrangler.toml only
      # takes effect once something has been deployed from a branch that is
      # not the production branch — a pull request, or this workflow run by
      # hand from that branch.
      - name: Publish
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=tallinntastebuds --branch=${{ github.ref_name }} --commit-dirty=true

      # The Google venues, into the database the deployment above talks to.
      #
      # db/google-venues.sql is a mirror of the Google Places export and is
      # what loads it — see the Google venues section of README.md. It used to
      # be run by hand with wrangler after a refresh, and the one time it was
      # not, the site spent a week describing a directory it did not have. So
      # a deploy runs it, against the same database the deployment gets:
      # production from the production branch, preview from anything else.
      #
      # Only when the file changed, though. The file is safe to run twice —
      # every row is an upsert — but it is eighty-odd statements and a write
      # to every row, and the story cron above deploys every hour; run each
      # time, that would spend most of D1's free daily writes on rows that had
      # not moved. A push says what it changed, so that is what decides. A run
      # started by hand loads regardless, because that is what starting one by
      # hand is for; the cron's runs never do, because a story cannot change
      # this file.
      - name: Did the Google venues change
        id: venues
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          load=no
          case "${{ github.event_name }}" in
            workflow_dispatch) load=yes ;;
            push)
              # Shallow checkout, so the previous head has to be fetched by
              # hand before the two can be compared. A branch pushed for the
              # first time has no previous head, and loads.
              if ! git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
                load=yes
              elif ! git diff --quiet "$BEFORE" HEAD -- db/google-venues.sql; then
                load=yes
              fi ;;
          esac
          echo "load=$load" >> "$GITHUB_OUTPUT"
          echo "db/google-venues.sql changed, load it: $load"

      - name: Load the Google venues
        if: steps.venues.outputs.load == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute ${{ github.ref_name == env.PROD_BRANCH && 'tallinntastebuds' || 'tallinntastebuds-preview' }} --remote --file=db/google-venues.sql
