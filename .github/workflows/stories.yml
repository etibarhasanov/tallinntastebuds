name: stories

# The clock, on the hour.
#
# Nothing here decides when a story is seen. assets/app.js reads the same
# "from" and "until" out of data/stories.json that this does, and starts and
# stops the story in the viewer's own browser on the minute — data/* is served
# must-revalidate, so a story scheduled a week ago goes up at nine in the
# morning with nobody awake and no deploy in between. That is the point of
# writing the time into the file rather than into a queue somewhere.
#
# This is the other half: the tidying up afterwards, which is the part a
# person forgets. When a story's day and a half is over,
# `node tools/stories.mjs --tick`:
#
#   - moves a photograph of a place into photos/<spot>/, lists it on the
#     place, and drops the story entry and the file — the story expires, the
#     photograph does not;
#   - switches off anything else that has run out, and leaves the file alone,
#     because deleting somebody's video is somebody's decision.
#
# It commits only when there is something to commit, so a quiet hour is a run
# that touches nothing.
#
# GitHub stops scheduled workflows in a repository that has had no activity
# for 60 days. If the ring ever stops clearing itself, that is the first thing
# to check — the Actions tab will say so, and one push starts it again.

on:
  schedule:
    # Five past, so it is not queued behind the whole world's midnight cron.
    # A story's own start and end are exact; this only has to be soon after.
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Two ticks writing the same two files at once would be one of them force-
# pushing over the other.
concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  tick:
    name: What the clock says is due
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.tick.outputs.changed }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because this job commits: a shallow checkout
          # can push, but it cannot rebase onto somebody who pushed while it
          # was thinking, and that is the one thing that goes wrong here.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm install`, here or anywhere else in this repo.
      - name: Tick
        id: tick
        run: node tools/stories.mjs --tick

      # The same gate every other path to the live site goes through: this
      # writes data/restaurants.json, so it is held to the same standard as a
      # person writing it.
      - name: Validate data
        if: steps.tick.outputs.changed == 'true'
        run: node tools/validate.mjs

      - name: Commit and push
        id: push
        if: steps.tick.outputs.changed == 'true'
        # The summary is built out of story ids and photo filenames, which the
        # validator holds to slugs — but it goes through the environment
        # rather than into the script text all the same, because a shell that
        # is handed data is a shell that can be handed anything.
        env:
          SUMMARY: ${{ steps.tick.outputs.summary }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data stories photos
          if git diff --cached --quiet; then
            echo "::notice::Nothing staged after all."
            exit 0
          fi
          git commit -m "$SUMMARY" \
                     -m "Posted by .github/workflows/stories.yml — see tools/stories.mjs."
          pushed=
          for wait in 0 2 4 8; do
            [ "$wait" = 0 ] || sleep "$wait"
            if git push origin "HEAD:$BRANCH"; then pushed=yes; break; fi
            # Either the network, or somebody committed while this was
            # thinking. Take their work and go again; a tick is one commit on
            # top of whatever is there, never a version of it.
            git fetch origin "$BRANCH" && git rebase "origin/$BRANCH" || git rebase --abort || true
          done
          [ -n "$pushed" ] || { echo "::error::Could not push the tick. The next hour will try again."; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not start another workflow, so the
  # deploy is asked for rather than waited for. Nothing runs when nothing
  # changed, which is almost every hour.
  publish:
    name: Publish
    needs: tick
    if: needs.tick.outputs.changed == 'true' && needs.tick.outputs.sha != ''
    uses: ./.github/workflows/cloudflare.yml
    secrets: inherit
    with:
      ref: ${{ needs.tick.outputs.sha }}
