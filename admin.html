        step('Removing ' + gone.length + ' photograph' + (gone.length === 1 ? '' : 's') + '…');
        return gh('/contents/photos/' + place.id + '?ref=' + encodeURIComponent(branch))
          .then(function (listing) {
            var shaOf = {};
            (listing || []).forEach(function (f) { shaOf[f.name] = f.sha; });
            var i = 0;
            function next() {
              if (i >= gone.length) return Promise.resolve();
              var file = gone[i++];
              if (!shaOf[file]) return next();
              return fetch('https://api.github.com/repos/' + REPO +
                  '/contents/photos/' + place.id + '/' + file, {
                method: 'DELETE',
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
                           'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Drop ' + file + ' from ' + place.name,
                                       sha: shaOf[file], branch: branch })
              }).then(function (res) {
                if (!res.ok) throw new Error('Could not remove ' + file + ' (' + res.status + ').');
                return next();
              });
            }
            return next();
          });
      })
      .then(function () {
        /* One at a time: the Contents API writes a commit per call, and two
           in flight against one branch is one of them losing. */
        var i = 0;
        function next() {
          if (i >= shots.length) return Promise.resolve();
          var n = i + 1;
          step('Uploading photograph ' + n + ' of ' + shots.length + '…');
          return blobToB64(shots[i].small.blob)
            .then(function (b64) {
              return putFile('photos/' + place.id + '/' + fresh[i], b64,
                'Add ' + fresh[i] + ' for ' + place.name, branch);
            })
            .then(function () { i++; return next(); });
        }
        return next();
      })
      .then(function () {
        step('Writing the entry…');
        return gh('/contents/data/restaurants.json?ref=' + encodeURIComponent(branch));
      })
      .then(function (current) {
        var places = JSON.parse(b64ToText(current.content));
        var at = places.findIndex(function (pl) { return pl.id === place.id; });

        if (editing) {
          if (at === -1) throw new Error('"' + place.id + '" is no longer in the file.');
          places.splice(at, 1);
        } else if (at !== -1) {
          throw new Error('There is already a place with the id "' + place.id + '".');
        }

        /* The file is in name order under Estonian collation — o, then õ, then
           ä — which is why Põhja Konn sits after Pulla and not before it.
           Re-slotting rather than writing back in place is what keeps a
           renamed place in the right spot. */
        var to = places.findIndex(function (pl) {
          return pl.name.localeCompare(place.name, 'et') > 0;
        });
        if (to === -1) places.push(place); else places.splice(to, 0, place);

        return putFile('data/restaurants.json',
          textToB64(JSON.stringify(places, null, 2) + '\n'),
          (editing ? 'Update ' : 'Add ') + place.name, branch, current.sha);
      })
      .then(function () {
        step('Opening the pull request…');
        var lines = [
          (editing ? 'Changed' : 'Added') + ' from the admin page on a phone.',
          '',
          '| | |',
          '| --- | --- |',
          '| Address | ' + place.address + ' |',
          '| Coordinates | ' + place.lat + ', ' + place.lng + ' |',
          '| Price | ' + place.price + ' |',
          '| Types | ' + place.types.join(', ') + ' |',
          '| Photographs | ' + (place.photos.length || 'none yet') + ' |',
          '| Reel | ' + (place.reel || 'none yet') + ' |'
        ];
        if (editing) {
          lines.push('| Open | ' + (place.closed ? 'no, it has closed' : 'yes') + ' |');
          var changed = [];
          if (existing.name !== place.name) changed.push('renamed from "' + existing.name + '"');
          if (existing.address !== place.address) changed.push('address');
          if (existing.lat !== place.lat || existing.lng !== place.lng) changed.push('coordinates');
          if (existing.price !== place.price) changed.push('price');
          if (existing.types.join() !== place.types.join()) changed.push('types');
          if ((existing.reel || '') !== place.reel) changed.push('reel');
          if (!!existing.closed !== !!place.closed) changed.push(place.closed ? 'marked closed' : 'reopened');
          if (fresh.length) changed.push(fresh.length + ' photograph' + (fresh.length === 1 ? '' : 's') + ' added');
          if (gone.length) changed.push(gone.join(', ') + ' removed');
          lines.push('', '**Changed:** ' + (changed.length ? changed.join(', ') : 'the write-up or the dishes') + '.');

          var others = Object.keys(existing.blurb || {}).filter(function (l) { return l !== 'en'; });
          if (others.length && (existing.blurb.en || '') !== place.blurb.en) {
            lines.push('',
              '> The English write-up changed and the other ' + others.length +
              ' translations did not, so they no longer say the same thing. ' +
              'They are ' + others.join(', ') + '.');
          }
        } else {
          lines.push('',
            'The write-up is English only. The other nine languages, the `visited` month',
            'and anything else still missing are a laptop job — the validator warns about',
            'them rather than failing, so this can be merged and finished after.');
        }
        lines.push('', 'Check the pin lands on the right side of the street before merging.');

        return fetch('https://api.github.com/repos/' + REPO + '/pulls', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
                     'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: (editing ? 'Update ' : 'Add ') + place.name,
            head: branch, base: base, body: lines.join('\n')
          })
        }).then(function (res) {
          if (!res.ok) {
            return res.json().catch(function () { return {}; }).then(function (err) {
              throw new Error('The branch is pushed, but the pull request would not open (' +
                res.status + (err.message ? ': ' + err.message : '') + '). Open it by hand from ' + branch + '.');
            });
          }
          return res.json();
        });
      })
      .then(function (pr) { return { title: pr.title, url: pr.html_url }; });
  }

  /* ------------------------------------------------------------ idle lock */

  function touch() {
    window.clearTimeout(idleTimer);
    if (!token) return;
    idleTimer = window.setTimeout(function () {
      token = null;
      boot();
    }, IDLE_MS);
  }

  ['pointerdown', 'keydown'].forEach(function (kind) {
    window.addEventListener(kind, function () { if (token) touch(); }, { passive: true });
  });

  /* ----------------------------------------------------------------- boot */

  function boot() {
    clear(body);
    if (!window.crypto || !window.crypto.subtle) return insecure();
    return vault() ? locked() : setup();
  }

  boot();
})();
</script>
</body>
