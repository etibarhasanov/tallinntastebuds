      css.integrity = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';
      css.crossOrigin = '';
      document.head.appendChild(css);

      var js = document.createElement('script');
      js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      js.integrity = 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';
      js.crossOrigin = '';
      js.onload = function () {
        if (window.L) resolve(window.L);
        else reject(new Error('Leaflet loaded but is not there.'));
      };
      js.onerror = function () { reject(new Error('The map would not load.')); };
      document.head.appendChild(js);
    });
    return leafletReady;
  }

  /* One pin on a map of Tallinn. `onMove` is told every time it lands
     somewhere new; the handle back lets the form move it when the numbers are
     typed or the phone is asked where it is. */
  function mapPicker(host, start, onMove) {
    var handle = { goto: function () {} };

    loadLeaflet().then(function (L) {
      clear(host);
      var map = L.map(host).setView(start || TALLINN, start ? 17 : 13);
      TTBBasemap.layer(L).addTo(map);

      var pin = L.marker(start || TALLINN, { draggable: true, autoPan: true }).addTo(map);
      /* A place with no coordinates yet gets a faint pin in the middle of the
         city: something to drag, without claiming the middle of the city is
         the answer. */
      if (!start && pin.setOpacity) pin.setOpacity(0.4);

      function landed(latlng) {
        if (pin.setOpacity) pin.setOpacity(1);
        onMove(latlng.lat, latlng.lng);
      }
      pin.on('dragend', function () { landed(pin.getLatLng()); });
      map.on('click', function (e) { pin.setLatLng(e.latlng); landed(e.latlng); });

      handle.goto = function (lat, lng) {
        pin.setLatLng([lat, lng]);
        if (pin.setOpacity) pin.setOpacity(1);
        map.setView([lat, lng], Math.max(map.getZoom(), 17));
      };

      /* Leaflet measures the container on construction, and the browser has
         not finished laying the form out by then. */
      window.setTimeout(function () { map.invalidateSize(); }, 0);
    }).catch(function (err) {
      clear(host);
      host.appendChild(el('p', { className: 'hint', textContent:
        err.message + ' Type the coordinates in instead — that is all the map was going to write.' }));
    });

    return handle;
  }

  /* Which place to change. Closed ones are in the list too — reopening one is
     an edit like any other, and it is the only way back. */
  function editPicker(repo, into) {
    clear(into);
    var pick = el('select', { id: 'which' }, [
      el('option', { value: '', textContent: 'Loading the places…' })
    ]);
    into.appendChild(el('label', { for: 'which', textContent: 'Which place' }));
    into.appendChild(pick);
    var hint = el('p', { className: 'hint', textContent:
      'Everything the form does not ask about is left exactly as it is — the other ' +
      'ten write-ups, the month you visited, the date it was added.' });
    into.appendChild(hint);

    loadPlaces(true).then(function (places) {
      clear(pick);
      pick.appendChild(el('option', { value: '', textContent: 'Choose a place…' }));
      places.forEach(function (pl) {
        pick.appendChild(el('option', { value: pl.id,
          textContent: pl.name + (pl.closed ? ' (closed)' : '') }));
      });
      pick.addEventListener('change', function () {
        var chosen = places.filter(function (pl) { return pl.id === pick.value; })[0];
        if (chosen) placeForm(repo, into, chosen, null);
      });
    }).catch(function () {
      clear(pick);
      pick.appendChild(el('option', { value: '', textContent: 'Could not load the places' }));
    });
  }

  /* ---------------------------------------------------------- find it first
   * Adding a place starts from Google's directory rather than a blank form.
   * Eleven hundred places in Tallinn are already in google_venues with their
   * name, address, door, phone and website, so the one the owner has just
   * eaten at is almost always there: type a few letters, pick it, and the
   * part of the form that is facts rather than opinion is filled in. What is
   * left is the part only the owner can write — the kind of place, the
   * price, a line about it, the photographs.
   *
   * /api/admin/venues hands the whole roll over once, as /admin/google reads
   * it, and it is filtered here letter by letter. A row already tied to a
   * place on the map says so and opens that place's edit instead, so nothing
   * is added twice. If the roll will not load, or the place is not in it, the
   * form opens blank: typing it in is how every place before this got there.
   */
  var venuesReady = null;
  function loadVenues() {
    if (!venuesReady) {
      venuesReady = fetch('/api/admin/venues', { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .catch(function (e) { venuesReady = null; throw e; });
    }
    return venuesReady;
  }

  /* Lowercase, accents off, so "pohja" finds Põhja. */
  function folded(text) {
    var out = String(text || '').toLowerCase();
    try { out = out.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) { /* older engine */ }
    return out;
  }

  /* Google writes a phone however the place gave it; the map wants the
     international form the validator checks, +372 then groups. A number that
     will not fit is left as Google had it, and the form says so. */
  function phoneFrom(raw) {
    var digits = String(raw || '').replace(/[^\d+]/g, '');
    if (!digits) return '';
    if (digits.charAt(0) !== '+') digits = '+372' + digits.replace(/^0+/, '');
    var m = /^\+372(\d{7,8})$/.exec(digits);
    if (!m) return String(raw).trim();
    var n = m[1];
    return '+372 ' + (n.length === 7 ? n.slice(0, 3) + ' ' + n.slice(3) : n.slice(0, 4) + ' ' + n.slice(4));
  }

  function findStep(repo, into) {
    clear(into);
    into.appendChild(steps(0));
    var q = el('input', { type: 'text', id: 'find', autocomplete: 'off',
      autocapitalize: 'off', spellcheck: 'false', placeholder: 'A few letters of the name' });
    into.appendChild(el('label', { for: 'find', textContent: 'Where is it?' }));
    into.appendChild(q);
    var hint = el('p', { className: 'hint', textContent: 'Loading Google’s Tallinn directory…' });
    into.appendChild(hint);
    var list = el('ul', { className: 'found' });
    into.appendChild(list);
    var byHand = el('button', { type: 'button', className: 'quiet',
      textContent: 'Not in the list — type it in by hand' });
    byHand.addEventListener('click', function () { placeForm(repo, into, null, null); });
    into.appendChild(byHand);

    var rows = [], mine = {};
    function draw() {
      clear(list);
      var want = folded(q.value.trim());
      if (want.length < 2) return;
      rows.filter(function (v) { return folded(v.name).indexOf(want) !== -1; })
        .slice(0, 8)
        .forEach(function (v) {
          var onMap = v.mapId && mine[v.mapId];
          var row = el('button', { type: 'button', className: 'found-row' }, [
            el('span', {}, [
              el('b', { textContent: v.name }),
              el('small', { textContent: [v.address, v.kitchens && v.kitchens[0]].filter(Boolean).join(' · ') })
            ]),
            el('em', { textContent: onMap ? 'on the map — edit' : 'pick' })
          ]);
          row.addEventListener('click', function () {
            if (onMap) placeForm(repo, into, mine[v.mapId], null);
            else placeForm(repo, into, null, v);
          });
          list.appendChild(el('li', {}, [row]));
        });
      if (!list.firstChild) list.appendChild(el('li', { className: 'hint', textContent: 'Nothing by that name.' }));
    }
    q.addEventListener('input', draw);

    Promise.all([loadVenues(), loadPlaces(true)]).then(function (got) {
      rows = got[0];
      got[1].forEach(function (pl) { mine[pl.id] = pl; });
      hint.textContent = 'Searches the ' + rows.length.toLocaleString('en') +
        ' places in Google’s Tallinn directory.';
      draw();
    }).catch(function () {
      hint.textContent = 'Google’s directory would not load, so type it in by hand.';
    });
    q.focus();
  }

  /* The three steps across the top of a place form, the one it is on lit. */
  function steps(on) {
    return el('div', { className: 'steps' }, ['1 Find it', '2 Your take', '3 Live'].map(function (t, i) {
      return el('span', { className: i === on ? 'on' : '', textContent: t });
    }));
  }

  /* One form, two jobs. `existing` null means a new place, prefilled from
     `google` when it was picked from the directory; anything else is the
     object as it sits in the file right now, and the entry written back is
     that object with only the fields below replaced — which is the whole
     reason an edit cannot be built by filling a blank form and saving it. */
  function placeForm(repo, into, existing, google) {
    var editing = !!existing;
    var shots = [];
    var drop = {};        /* photos ticked for removal, by filename */
    var start = editing ? existing : google ? {
      name: google.name, address: google.address || '',
      lat: google.lat, lng: google.lng,
      website: google.website || '', phone: phoneFrom(google.phone),
      price: google.price || 2
    } : null;

    clear(into);
    into.appendChild(steps(1));

    function field(where, id, label, node, hint) {
      where.appendChild(el('label', { for: id, textContent: label }));
      where.appendChild(node);
      if (hint) where.appendChild(el('p', { className: 'hint', textContent: hint }));
      return node;
    }

    /* The facts. Picked from Google they are folded away under one line that
       says so — open it to correct one; typed by hand, or being edited, they
       are the top of the form. */
    var facts = into;
    if (google) {
      into.appendChild(el('h2', { className: 'place-name', textContent: google.name }));
      facts = el('details', { className: 'more' }, [
        el('summary', {}, [
          (google.address || 'No address') + ' ',
          el('span', { className: 'fromg', textContent: '✓ from Google · change' })
        ])
      ]);
      into.appendChild(facts);
    }

    var nameIn = field(facts, 'name', 'Name', el('input', { type: 'text', id: 'name',
      value: start ? start.name : '' }));
    var addrIn = field(facts, 'addr', 'Address', el('input', { type: 'text', id: 'addr',
      value: start ? start.address : '' }));
    var siteIn = field(facts, 'site', 'Website', el('input', { type: 'text', id: 'site',
      value: start ? (start.website || '') : '',
      placeholder: 'https://…', autocapitalize: 'off', spellcheck: 'false' }));
    var phoneIn = field(facts, 'phone', 'Phone', el('input', { type: 'text', id: 'phone',
      value: start ? (start.phone || '') : '', placeholder: '+372 661 0180' }),
      'Optional, international form. Without it the panel drops the Call button.');

    var coordIn = el('input', { type: 'text', id: 'coord',
      value: start && typeof start.lat === 'number' ? start.lat + ', ' + start.lng : '',
      placeholder: '59.4370, 24.7536', autocapitalize: 'off', spellcheck: 'false' });
    var hereBtn = el('button', { type: 'button', className: 'quiet', textContent: 'I am here' });
    into.appendChild(el('label', { for: 'coord', textContent: 'Where the door is' }));
    into.appendChild(el('div', { className: 'row' }, [coordIn, hereBtn]));
    var coordHint = el('p', { className: 'hint', textContent: editing
      ? 'Drag the pin, or press the map where it should be. Zoom in far enough to see which side of the street it is on.'
      : google ? 'Google’s pin. Drag it onto the door if it is out.'
      : 'Press the map where the door is, paste the pair off Google Maps, or press the button while standing there.' });
    into.appendChild(coordHint);

    var mapBox = el('div', { className: 'map' }, [
      el('p', { className: 'hint', textContent: 'Loading the map…' })
    ]);
    into.appendChild(mapBox);

    /* The field and the pin are two views of one number, so each has to be
       able to move the other without setting off the one that moved it. */
    var pinMoving = false;
    var startAt = coords();
    var picker = mapPicker(mapBox, startAt ? [startAt.lat, startAt.lng] : null,
      function (lat, lng) {
        pinMoving = true;
        coordIn.value = lat.toFixed(5) + ', ' + lng.toFixed(5);
        pinMoving = false;
        coordHint.textContent = 'Taken off the map. Zoom in and check it is the right doorway.';
        settle();
      });

    coordIn.addEventListener('input', function () {
      if (pinMoving) return;
      var c = coords();
      if (c) picker.goto(c.lat, c.lng);
    });

    hereBtn.addEventListener('click', function () {
      if (!navigator.geolocation) { coordHint.textContent = 'This browser will not say where it is.'; return; }
      coordHint.textContent = 'Asking the phone…';
      navigator.geolocation.getCurrentPosition(function (pos) {
        coordIn.value = pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5);
        picker.goto(pos.coords.latitude, pos.coords.longitude);
        coordHint.textContent = 'Where the phone thinks it is, to about ' +
          Math.round(pos.coords.accuracy) + ' m. Drag the pin onto the door if it is out.';
        settle();
      }, function () {
        coordHint.textContent = 'The phone would not say. Press the map instead, or paste the pair from Google Maps.';
      }, { enableHighAccuracy: true, timeout: 10000 });
    });

    var typeBox = el('div', { className: 'types' });
    into.appendChild(el('label', { textContent: 'What kind of place' }));
    into.appendChild(typeBox);
    fetch('data/taxonomy.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (tax) {
        clear(typeBox);
        tax.types.forEach(function (t) {
          var on = editing && existing.types.indexOf(t.id) !== -1;
          var box = el('input', { type: 'checkbox', value: t.id, checked: on || null });
          box.addEventListener('change', settle);
          typeBox.appendChild(el('label', {}, [box, t.en]));
        });
        settle();
      })
      .catch(function () {
        typeBox.appendChild(el('p', { className: 'hint', textContent: 'Could not load the types.' }));
      });

    var priceIn = el('select', { id: 'price' });
    [1, 1.5, 2, 2.5, 3, 3.5, 4].forEach(function (n) {
      priceIn.appendChild(el('option', { value: String(n),
        textContent: '€'.repeat(Math.ceil(n)) + (n % 1 ? ' (half a step down)' : '') + '  ·  ' + n }));
    });
    priceIn.value = String(start ? start.price : 2);
    field(into, 'price', 'Price', priceIn, google && google.price ? 'Google’s band. Move it if it is wrong.' : null);

    var hadEn = editing && existing.blurb && existing.blurb.en ? existing.blurb.en : '';
    var others = editing
      ? Object.keys(existing.blurb || {}).filter(function (l) { return l !== 'en'; })
      : [];
    var blurbIn = field(into, 'blurb', 'Your line about it, in English',
      el('textarea', { id: 'blurb', maxlength: '600', textContent: hadEn }),
      others.length ? null
        : 'The one thing that has to be written. The other ten languages show it until they are translated.');
    if (others.length) {
      var warnLine = el('p', { className: 'hint' });
      into.appendChild(warnLine);
      var sayDrift = function () {
        warnLine.textContent = blurbIn.value.trim() !== hadEn
          ? 'Changed. The ' + others.length + ' other translations are left as they are, so they ' +
            'no longer say this.'
          : 'There are ' + others.length + ' other translations. They are left untouched.';
      };
      blurbIn.addEventListener('input', sayDrift);
      sayDrift();
    }

    var dishesIn = field(into, 'dishes', 'Must order',
      el('textarea', { id: 'dishes',
        textContent: editing ? (existing.mustOrder || []).join('\n') : '',
        placeholder: 'Optional. One a line.' }));

    /* Closed is the one field that only makes sense on something that already
       exists, and it is a change rather than a deletion on purpose: the place
       keeps its page, its photographs and its write-up, and says it has shut.
       Two ways of being shut, because they are two different facts: for the
       moment, which is Google's word and what the Google tab raises, and for
       good, which is only ever said from here. */
    var shutIns = null;
    if (editing) {
      var current = existing.closed === 'temporary' ? 'temporary' : existing.closed ? 'gone' : 'open';
      var choices = [['open', 'Open'], ['temporary', 'Temporarily closed'], ['gone', 'Closed for good']];
      shutIns = choices.map(function (pair) {
        return el('input', { type: 'radio', name: 'shut', value: pair[0], checked: current === pair[0] || null });
      });
      into.appendChild(el('label', { textContent: 'Open or closed' }));
      into.appendChild(el('div', { className: 'types' }, choices.map(function (pair, i) {
        return el('label', {}, [shutIns[i], pair[1]]);
      })));
      into.appendChild(el('p', { className: 'hint', textContent:
        'Either kind keeps it on the map rather than deleting it — somebody looking ' +
        'for it deserves to be told. Temporarily closed keeps the pin’s colour and ' +
        'says the door should open again; the Google tab offers that one when ' +
        'Google says so.' }));
    }
    function shutValue() {
      var on = (shutIns || []).filter(function (radio) { return radio.checked; })[0];
      if (!on || on.value === 'open') return false;
      return on.value === 'temporary' ? 'temporary' : true;
    }

    /* What is already there, each with a tick to take it away. */
    if (editing && (existing.photos || []).length) {
      into.appendChild(el('label', { textContent: 'Photographs already there' }));
      var have = el('div', { className: 'thumbs' });
      existing.photos.forEach(function (file) {
        var box = el('input', { type: 'checkbox' });
        box.addEventListener('change', function () {
          drop[file] = box.checked;
          fig.style.opacity = box.checked ? '.4' : '';
        });
        var fig = el('figure', {}, [
          el('img', { src: 'photos/' + existing.id + '/' + file, alt: '', loading: 'lazy' }),
          el('figcaption', {}, [box, ' ' + file])
        ]);
        have.appendChild(fig);
      });
      into.appendChild(have);
      into.appendChild(el('p', { className: 'hint', textContent:
        'Tick one to drop it. The file is deleted from the repository too, since ' +
        'nothing else points at it.' }));
    }

    var photoIn = field(into, 'photos', editing ? 'Add more photographs' : 'Photographs',
      el('input', { type: 'file', id: 'photos', accept: 'image/*', multiple: true }),
      'Shrunk here to 1600px under 200 KB, WebP or JPEG depending on the browser. ' +
      'EXIF and GPS go with the re-encode. The first one is the picture a shared link shows.');
    var thumbs = el('div', { className: 'thumbs' });
    into.appendChild(thumbs);

    /* What is rarely touched: the id, which is made from the name and never
       changes once a place exists, and the reel, which usually comes later. */
    var more = el('details', { className: 'more' }, [
      el('summary', { textContent: 'More: the id, the reel' })
    ]);
    var idIn = field(more, 'id', 'Id', el('input', { type: 'text', id: 'id',
      value: editing ? existing.id : slugify(nameIn.value), readonly: editing || null,
      autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' }),
      editing
        ? 'Fixed. It is the folder the photographs live in and what ?spot= points at, and every link ever shared uses it.'
        : 'Made from the name. It is the folder the photos live in and what ?spot= points at, so it never changes afterwards.');
    if (!editing) {
      nameIn.addEventListener('input', function () {
        if (!idIn.dataset.touched) idIn.value = slugify(nameIn.value);
      });
      idIn.addEventListener('input', function () { idIn.dataset.touched = '1'; });
    }
    var reelIn = field(more, 'reel', 'Reel', el('input', { type: 'text', id: 'reel',
      value: editing ? (existing.reel || '') : '',
      placeholder: 'https://www.instagram.com/reel/…', autocapitalize: 'off', spellcheck: 'false' }),
      'Optional. Instagram or TikTok permalink, off the web rather than the app.');
    into.appendChild(more);

    var go = el('button', { type: 'button', disabled: true,
      textContent: editing ? 'Save the changes' : 'Put it on the map' });
    into.appendChild(go);
    var back = el('button', { type: 'button', className: 'quiet', textContent: 'Back' });
    back.addEventListener('click', function () {
      if (editing) editPicker(repo, into); else findStep(repo, into);
    });
    into.appendChild(back);
    var out = el('div');
    into.appendChild(out);

    photoIn.addEventListener('change', function () {
      var files = Array.prototype.slice.call(photoIn.files || []);
      shots = [];
      clear(thumbs);
      if (!files.length) { settle(); return; }
      thumbs.appendChild(el('p', { className: 'hint', textContent: 'Shrinking ' + files.length + '…' }));
      Promise.all(files.map(function (f) {
        return shrink(f).then(function (small) { return { small: small, file: f }; });
      })).then(function (done) {
        shots = done;
        clear(thumbs);
        done.forEach(function (d, i) {
          var img = el('img', { alt: '' });
          img.src = URL.createObjectURL(d.small.blob);
          img.addEventListener('load', function () { URL.revokeObjectURL(img.src); });
          thumbs.appendChild(el('figure', {}, [
            img,
            /* The name it will actually land under, worked out the same way
               the submit does, so the preview is not a guess. */
            el('figcaption', { textContent:
              pad2(highestSoFar() + i + 1) + '.' + d.small.ext +
              ' · ' + Math.round(d.small.blob.size / 1024) + ' KB' +
              (d.small.over ? ' — over budget' : '') })
          ]));
        });
        var before = done.reduce(function (n, d) { return n + d.file.size; }, 0);
        var after = done.reduce(function (n, d) { return n + d.small.blob.size; }, 0);
        thumbs.appendChild(el('p', { className: 'hint', textContent:
          Math.round(before / 1024) + ' KB of camera roll became ' +
          Math.round(after / 1024) + ' KB in the repository.' }));
        settle();
      }).catch(function (err) {
        clear(thumbs);
        thumbs.appendChild(el('p', { className: 'hint', textContent: 'Could not read those. ' + err.message }));
      });
    });

    [nameIn, idIn, addrIn, coordIn, blurbIn].forEach(function (node) {
      node.addEventListener('input', settle);
    });

    /* New files are numbered past the highest that has ever been there, never
       into a gap a removal just made: /photos/* is cached for a week, so a
       reused name would serve last month's picture to anybody who had seen the
       old one. The preview and the submit both ask this, so they agree. */
    function highestSoFar() {
      return (editing ? (existing.photos || []) : []).reduce(function (n, f) {
        var m = /^(\d+)\./.exec(f);
        return m ? Math.max(n, Number(m[1])) : n;
      }, 0);
    }

    function chosenTypes() {
      return Array.prototype.slice.call(typeBox.querySelectorAll('input:checked'))
        .map(function (b) { return b.value; });
    }

    function coords() {
      var nums = String(coordIn.value).match(/-?\d+\.\d+/g);
      if (!nums || nums.length < 2) return null;
      return { lat: Number(nums[0]), lng: Number(nums[1]) };
    }

    function dropped() {
      return Object.keys(drop).filter(function (f) { return drop[f]; });
    }

    /* The same list the validator keeps, asked before the branch exists rather
       than after the check has gone red. */
    function complaints() {
      var bad = [];
      if (!nameIn.value.trim()) bad.push('It needs a name.');
      if (!SLUG_RE.test(idIn.value.trim())) bad.push('The id has to be a lowercase slug.');
      if (!addrIn.value.trim()) bad.push('It needs an address.');

      var c = coords();
      if (!c) bad.push('Coordinates should be two decimal numbers, lat first.');
      else if (c.lat < BBOX.latMin || c.lat > BBOX.latMax || c.lng < BBOX.lngMin || c.lng > BBOX.lngMax) {
        bad.push('Those coordinates are outside Tallinn. Lat is about 59.4 and lng about 24.7 — the wrong way round puts it in the Arabian Sea.');
      }
      if (!chosenTypes().length) bad.push('Pick at least one kind of place.');
      if (!blurbIn.value.trim()) bad.push('The line about it is the one thing that has to be written.');

      var reel = reelIn.value.trim();
      if (reel && !REEL_IG.test(reel) && !REEL_TT.test(reel)) {
        bad.push('That is not an Instagram or TikTok permalink.');
      }
      var site = siteIn.value.trim();
      if (site && !URL_RE.test(site)) bad.push('The website needs the https:// on the front.');
      var phone = phoneIn.value.trim();
      if (phone && !PHONE_RE.test(phone)) bad.push('The phone wants international form, like +372 661 0180.');
      return bad;
    }

    function settle() {
      go.disabled = !(nameIn.value.trim() && idIn.value.trim() && addrIn.value.trim()
        && coords() && blurbIn.value.trim() && chosenTypes().length);
    }

    go.addEventListener('click', function () {
      var bad = complaints();
      clear(out);
      if (bad.length) {
        /* The facts and the id may be folded away; a complaint about one of
           them is no use if the field it is about cannot be seen. */
        if (facts !== into) facts.open = true;
        more.open = true;
        bad.forEach(function (line) { say(out, line, 'bad'); });
        return;
      }

      var c = coords();
      /* An edit starts from the object as it is and replaces only what the
         form asked about. Everything else rides along untouched: the other
         ten write-ups, "visited", "added", and any key added to the data
         after this page was written. */
      var place = editing ? JSON.parse(JSON.stringify(existing)) : {};
      place.id = idIn.value.trim();
      place.name = nameIn.value.trim();
      place.address = addrIn.value.trim();
      place.lat = Number(c.lat.toFixed(7));
      place.lng = Number(c.lng.toFixed(7));
      place.price = Number(priceIn.value);
      place.types = chosenTypes();
      place.blurb = Object.assign({}, place.blurb || {},
        { en: blurbIn.value.trim().replace(/[—–]/g, '-') });
      place.mustOrder = dishesIn.value.split('\n').map(function (d) { return d.trim(); })
        .filter(function (d) { return d; });
      place.reel = reelIn.value.trim();
      place.closed = shutValue();
      if (!editing) place.added = tallinnNow().slice(0, 10);

      var site = siteIn.value.trim(), phone = phoneIn.value.trim();
      if (site) place.website = site; else delete place.website;
      if (phone) place.phone = phone; else delete place.phone;

      var had = editing ? (existing.photos || []) : [];
      var highest = highestSoFar();
      var fresh = shots.map(function (d, i) { return pad2(highest + i + 1) + '.' + d.small.ext; });
      var gone = dropped();
      place.photos = had.filter(function (f) { return gone.indexOf(f) === -1; }).concat(fresh);

      go.disabled = true;
      back.disabled = true;
      var step = say(out, 'Saving…', 'spin');
      savePlace(repo, place, shots, fresh, gone, existing, function (msg) { step.textContent = msg; })
        .then(function (branch) {
          clear(into);
          into.appendChild(steps(2));
          watchLanding(into, branch, place, function () {
            if (editing) editPicker(repo, into); else findStep(repo, into);
          });
        })
        .catch(function (err) {
          clear(out);
          say(out, err.message, 'bad');
          go.disabled = false;
          back.disabled = false;
        });
    });

    settle();
  }

  /* A place is saved as one commit on a branch of its own, made through the
   * Git Data API rather than a commit per file: the photographs as blobs, one
   * tree with them, the photographs taken away and restaurants.json in it, one
   * commit, and the branch pointed at it last. One push, so the workflow that
   * lands it runs once, on the whole change — a commit per photograph would
   * start a run per photograph, and the first would land a folder of pictures
   * with no place to show them. A failure part-way leaves loose blobs nobody
   * points at, which GitHub sweeps up, and no branch at all.
   *
   * .github/workflows/generated.yml does the rest: rebuild, check, and put it
   * on the live branch if every check passes. Resolves with the branch name.
   */
  function savePlace(repo, place, shots, fresh, gone, existing, step) {
    var editing = !!existing;
    var stem = 'admin/' + (editing ? 'edit-' : 'add-') + place.id;
    var base, entries = [];

    return gh('/git/ref/heads/' + repo.branch)
      .then(function (ref) {
        if (!ref) throw new Error('Could not find the ' + repo.branch + ' branch.');
        base = ref.object.sha;
        /* One at a time, so a phone on a slow connection is not holding five
           photographs' worth of base64 in flight at once. */
        var i = 0;
        function next() {
          if (i >= shots.length) return Promise.resolve();
          var n = i++;
          step('Uploading photograph ' + (n + 1) + ' of ' + shots.length + '…');
          return blobToB64(shots[n].small.blob)
            .then(function (b64) {
              return gh('/git/blobs', { method: 'POST',
                body: JSON.stringify({ content: b64, encoding: 'base64' }) });
            })
            .then(function (blob) {
              entries.push({ path: 'photos/' + place.id + '/' + fresh[n], mode: '100644', type: 'blob', sha: blob.sha });
              return next();
            });
        }
        return next();
      })
      .then(function () {
        step('Writing the entry…');
        return Promise.all([
          gh('/contents/data/restaurants.json?ref=' + base),
          gh('/git/commits/' + base)
        ]);
      })
      .then(function (got) {
        var current = got[0], parent = got[1];
        var places = JSON.parse(b64ToText(current.content));
        var at = places.findIndex(function (pl) { return pl.id === place.id; });

        if (editing) {
          if (at === -1) throw new Error('"' + place.id + '" is no longer in the file.');
          places.splice(at, 1);
        } else if (at !== -1) {
          throw new Error('There is already a place with the id "' + place.id + '".');
        }

        /* The file is in name order under Estonian collation — o, then õ, then
           ä — which is why Põhja Konn sits after Pulla and not before it.
           Re-slotting rather than writing back in place is what keeps a
           renamed place in the right spot. */
        var to = places.findIndex(function (pl) {
          return pl.name.localeCompare(place.name, 'et') > 0;
        });
        if (to === -1) places.push(place); else places.splice(to, 0, place);

        entries.push({ path: 'data/restaurants.json', mode: '100644', type: 'blob',
          content: JSON.stringify(places, null, 2) + '\n' });
        gone.forEach(function (file) {
          entries.push({ path: 'photos/' + place.id + '/' + file, mode: '100644', type: 'blob', sha: null });
        });
        return gh('/git/trees', { method: 'POST',
          body: JSON.stringify({ base_tree: parent.tree.sha, tree: entries }) });
      })
      .then(function (tree) {
        return gh('/git/commits', { method: 'POST', body: JSON.stringify({
          message: (editing ? 'Update ' : 'Add ') + place.name + '\n\n' + commitBody(place, existing, fresh, gone),
          tree: tree.sha, parents: [base]
        }) });
      })
      .then(function (commit) {
        step('Sending it…');
        /* A second go at the same place finds the first branch still there if
           it has not landed yet, so it takes the next free name. */
        function make(name, tries) {
          return fetch(API + '/git/refs', {
            method: 'POST', cache: 'no-store',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ref: 'refs/heads/' + name, sha: commit.sha })
          }).then(function (res) {
            if (res.ok) return name;
            if (res.status === 422 && tries < 5) return make(stem + '-' + (tries + 2), tries + 1);
            throw new Error('Could not make a branch (' + res.status + ').');
          });
        }
        return make(stem, 0);
      });
  }

  /* The commit's body, in the repository's voice: what moved, and what the
     page could not do. */
  function commitBody(place, existing, fresh, gone) {
    var lines = [];
    if (!existing) {
      lines.push('Added from the admin page, ' + place.address + ', with ' +
        (place.photos.length ? place.photos.length + ' photograph' + (place.photos.length === 1 ? '' : 's') : 'no photographs yet') + '.',
        'The write-up is in English only; the other languages show it until they are translated.');
      return lines.join('\n');
    }
    var changed = [];
    if (existing.name !== place.name) changed.push('renamed from "' + existing.name + '"');
    if (existing.address !== place.address) changed.push('the address');
    if (existing.lat !== place.lat || existing.lng !== place.lng) changed.push('the pin');
    if (existing.price !== place.price) changed.push('the price');
    if (existing.types.join() !== place.types.join()) changed.push('the kinds of place');
    if ((existing.reel || '') !== place.reel) changed.push('the reel');
    if ((existing.closed || false) !== (place.closed || false)) {
      changed.push(place.closed === 'temporary' ? 'marked temporarily closed'
        : place.closed ? 'marked closed for good' : 'reopened');
    }
    if (fresh.length) changed.push(fresh.length + ' photograph' + (fresh.length === 1 ? '' : 's') + ' added');
    if (gone.length) changed.push(gone.join(', ') + ' removed');
    lines.push('Changed from the admin page: ' + (changed.length ? changed.join(', ') : 'the write-up or the dishes') + '.');
    var others = Object.keys(existing.blurb || {}).filter(function (l) { return l !== 'en'; });
    if (others.length && (existing.blurb.en || '') !== place.blurb.en) {
      lines.push('The English write-up changed and the ' + others.join(', ') +
        ' ones did not, so they no longer say the same thing.');
    }
    return lines.join('\n');
  }

  /* The place without its write-ups, keys in order, as data/map.json would
     carry it — what "live" is checked against. */
  function mapShape(place) {
    var out = {};
    Object.keys(place).sort().forEach(function (k) { if (k !== 'blurb') out[k] = place[k]; });
    return JSON.stringify(out);
  }

  /* After the branch is pushed, the page says what is happening to it, in the
   * three rows below, until it is live or until it is clear it will not be.
   *
   *   Checked    the generated workflow's run on the branch: rebuilt and
   *              every check passed, or red with a link to why. A red run
   *              puts nothing live and leaves the branch where it is.
   *   Live       data/map.json on this site carrying the place as it was
   *              saved. Cloudflare deploys within a minute or two of the
   *              push the workflow made.
   *
   * The page can be closed at any point; none of this needs it open. Past
   * the time limits it stops asking and says where to look.
   */
  var CHECK_LIMIT_MS = 10 * 60 * 1000;
  var LIVE_LIMIT_MS = 6 * 60 * 1000;

  function watchLanding(into, branch, place, again) {
    into.appendChild(el('h2', { textContent: place.name + ' is going on the map' }));
    var rows = el('ul', { className: 'prog' });
    function row(text) {
      var state = el('em', { textContent: 'waiting' });
      var li = el('li', {}, [el('span', { textContent: text }), state]);
      rows.appendChild(li);
      return { li: li, say: function (t, kind) { state.textContent = t; li.className = kind || ''; } };
    }
    var saved = row('Saved');
    var checked = row('Rebuilt and checked');
    var live = row('Live on tallinntastebuds.ee');
    saved.say('✓', 'done');
    checked.say('about two minutes…');
    into.appendChild(rows);
    var note = el('p', { className: 'note', textContent:
      'You can close this page; it finishes without you. If the check goes red, ' +
      'nothing goes live and the reason shows here.' });
    into.appendChild(note);
    var after = el('div');
    into.appendChild(after);

    function finish(link, linkText) {
      if (link) after.appendChild(el('p', { className: 'small' }, [
        el('a', { href: link, target: link.charAt(0) === '/' ? null : '_blank',
          rel: 'noopener noreferrer', textContent: linkText })
      ]));
      var b = el('button', { type: 'button', className: 'quiet', textContent: 'Add or change another' });
      b.addEventListener('click', again);
      after.appendChild(b);
    }

    var started = Date.now();
    function pollRun() {
      gh('/actions/runs?branch=' + encodeURIComponent(branch) + '&event=push&per_page=10')
        .then(function (r) {
          var run = ((r && r.workflow_runs) || []).filter(function (x) { return x.name === 'generated'; })[0];
          if (run && run.status === 'completed') {
            if (run.conclusion === 'success') {
              checked.say('✓', 'done');
              live.say('about a minute…');
              started = Date.now();
              return pollMap();
            }
            checked.say('✗ red', 'bad');
            note.textContent = 'Nothing went live. The run says why; the branch ' + branch +
              ' is kept, so the change is not lost.';
            return finish(run.html_url, 'Open the run on GitHub →');
          }
          if (Date.now() - started > CHECK_LIMIT_MS) {
            checked.say('still running', '');
            note.textContent = 'This is taking longer than it should. It will still land if it passes.';
            return finish('https://github.com/etibarhasanov/tallinntastebuds/actions', 'Watch it on GitHub →');
          }
          window.setTimeout(pollRun, 6000);
        })
        .catch(function () { window.setTimeout(pollRun, 10000); });
    }

    var want = mapShape(place);
    function pollMap() {
      fetch('/data/map.json', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (all) {
          var there = all.filter(function (pl) { return pl.id === place.id; })[0];
          if (there && mapShape(there) === want) {
            live.say('✓', 'done');
            note.textContent = 'Done. It is on the map now.';
            return finish('/?spot=' + encodeURIComponent(place.id), 'Open it on the map →');
          }
          if (Date.now() - started > LIVE_LIMIT_MS) {
            live.say('not yet', '');
            note.textContent = 'It passed and was pushed; the deploy is slow. Look again in a few minutes.';
            return finish('/?spot=' + encodeURIComponent(place.id), 'Open it on the map →');
          }
          window.setTimeout(pollMap, 8000);
        })
        .catch(function () { window.setTimeout(pollMap, 10000); });
    }

    pollRun();
  }

  /* ----------------------------------------------------------------- boot */

  /* The owner's style, as every other page on the site takes it — see
     applyStyle() in assets/lists.js, which is the fullest copy. The door
     writes nothing to ttb.style; it only reads what the map's swatch left. */
  var STYLES = ['red', 'green', 'blue', 'plum'];
  function applyStyle() {
    var fromUrl = new URLSearchParams(window.location.search).get('style');
    var stored = null;
    try { stored = window.localStorage.getItem('ttb.style'); } catch (e) { /* none */ }
    var style = STYLES.indexOf(fromUrl) !== -1 ? fromUrl
              : STYLES.indexOf(stored) !== -1 ? stored
              : 'red';
    document.documentElement.setAttribute('data-style', style);
    var meta = document.querySelector('meta[name="theme-color"]');
    var wash = getComputedStyle(document.documentElement).getPropertyValue('--wash').trim();
    if (meta && wash) meta.setAttribute('content', wash);
  }

  /* ------------------------------------------------------------ the door
   * One question, asked of the site: is this browser signed in as the owner,
   * and can the site write to the repository? reachRepo() says which of the
   * four it is, and each draws its own page.
   *
   *   in         the tools and the GitHub card.
   *   no-token   signed in, but GITHUB_TOKEN is not set: the Google report,
   *              which needs no token, and a line saying what is missing.
   *   out        anybody else, or the owner signed out: Sign in, which is the
   *              map's own sheet and comes back here.
   *   an error   said in words, with nothing else drawn.
   */
  function boot() {
    clear(body);
    body.className = 'card admin-card';
    while (stack.firstChild !== body) stack.removeChild(stack.firstChild);
    while (body.nextSibling) stack.removeChild(body.nextSibling);
    sub.textContent = 'Checking…';

    reachRepo().then(function (repo) {
      if (repo.door === 'in') return ready(repo);
      if (repo.door === 'out') {
        sub.textContent = 'Signed out.';
        var signIn = el('button', { type: 'button', textContent: 'Sign in' });
        signIn.addEventListener('click', function () {
          window.location.href = '/?account=in&then=' + encodeURIComponent('/admin.html');
        });
        body.appendChild(el('h2', { textContent: 'Sign in with the owner’s account' }));
        body.appendChild(el('p', { className: 'small', textContent:
          'The same account as on the map, with its password or Google. Nothing ' +
          'else is needed on this device.' }));
        body.appendChild(signIn);
        return;
      }
      sub.textContent = 'Signed in — reading only.';
      body.appendChild(el('h2', { textContent: 'The site has no GitHub token' }));
      body.appendChild(el('p', { className: 'note', textContent:
        'Changing the site needs GITHUB_TOKEN set in the Pages project’s production ' +
        'secrets: a fine-grained token for this one repository with Contents read and ' +
        'write and Actions read. README.md, under The admin page, has the steps.' }));
      /* At a desk the report is the work and this card a fact beside it. */
      body.classList.add('is-rail');
      var google = el('section', { className: 'card admin-card is-work' });
      stack.appendChild(google);
      googleReport(null, google);
    }).catch(function (err) {
      sub.textContent = 'Something is wrong.';
      say(body, err.message, 'bad');
    });
  }

  applyStyle();
  boot();
})();
</script>
</body>
</html>
