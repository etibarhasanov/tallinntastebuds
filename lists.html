<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lists | Tallinn Tastebuds</title>
<meta name="description" content="Your own top ten. Pick places, say what is good about each one, and send somebody the link.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7ddd4">

<!-- The block between the two PAGE-HEAD markers below is replaced, in place,
     whenever this same file is served at one of its other three addresses:
     functions/list/[id].js at /list/<id>, functions/lists/public.js at
     /lists/public, and functions/u/[name].js at /u/<name>. The description and
     the social card become that page's own and a second title is written
     above them, so a link somebody pastes into a message unfurls as what it
     is rather than as "Lists | Tallinn Tastebuds". Opened directly at
     /lists.html the markers are left alone and these defaults stand.

     PAGE-HEAD rather than LIST-HEAD, which is what it was called when a list
     was the only thing served through here.

     The markers are spelled out only where they actually mark something — not
     here. HTML comments do not nest, so writing one inside this sentence
     would end this comment early, drop the rest of it into the head as text,
     and take the whole document with it. It did once. -->
<!--PAGE-HEAD-->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tallinn Tastebuds">
<meta property="og:title" content="Lists | Tallinn Tastebuds">
<meta property="og:description" content="Your own top ten, from every place in Tallinn.">
<meta property="og:image" content="https://tallinntastebuds.ee/assets/logo/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!--/PAGE-HEAD-->

<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/assets/logo/icon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="/assets/logo/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="/assets/logo/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/logo/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Literata:opsz,wght@7..72,400..600&amp;display=swap">

<!-- The tokens, the card, the eyebrow and the toast all come from the map's
     stylesheet; only what a list page has and the map does not is in the
     second file. -->
<link rel="stylesheet" href="/assets/styles.css?v=39f196f3">
<link rel="stylesheet" href="/assets/lists.css?v=69ddcb95">
</head>
<body class="lists-body">

<a class="skip-link" href="#main" data-i18n="listsSkip">Skip to the list</a>

<header class="lists-brand">
  <a class="lists-home" href="/" data-i18n-aria-label="listsBack" aria-label="Back to the map">
    <img class="lists-mark" src="/assets/logo/mark-round.webp" alt="" width="40" height="40">
    <span class="lists-wordmark" data-i18n="wordmark">Tallinn Tastebuds</span>
  </a>
  <!-- Only ever a link to the map's account sheet: the sign-in form lives in
       exactly one place on this site and it is not here. See assets/lists.js. -->
  <a class="lists-who" id="lists-who" href="/?account=in" hidden></a>
  <!-- The map's radio, wearing the map's pill. It is the same station and the
       same on/off — assets/radio.js keeps both across the walk from the map to
       here — so it is the same button too, rather than a second design for one
       control. Hidden until data/radio.json is read, and for good if there is
       no station in it. -->
  <button type="button" class="rail-btn radio" id="btn-radio" aria-pressed="false" hidden
          data-i18n-title="radioPlay" data-i18n-aria-label="radioPlay"
          aria-label="Play the radio" title="Play the radio">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="ico-play" d="M8 5.5l11 6.5-11 6.5z"/>
      <path class="ico-stop" d="M8 6.5h3v11H8zM13 6.5h3v11h-3z"/>
    </svg>
    <span class="radio-name rail-label" id="radio-name"></span>
  </button>
</header>

<!-- Every state this page has — one list, one list somebody else made,
     everybody's lists, one person's, and the four ways it can fail — is built
     by assets/lists.js into this one element. Which of them is showing is
     decided at the moment the data arrives, so there is one place that decides
     and nothing can be left over from the state before.

     The index of your own lists was a sixth, and it is on /account.html now,
     beside the places you saved. Opened at /lists.html with no list, no person
     and no directory to draw, this page replaces itself with that one before
     it fetches anything — see boot() in assets/lists.js. -->
<main class="lists-main" id="main" tabindex="-1"></main>

<!-- The picker: every place in Tallinn, searched down to the one being added.
     Static markup because it is the same sheet whichever list is open, and
     because the input inside it must not be rebuilt under somebody's
     keystrokes. -->
<div class="scrim" id="picker-scrim" role="dialog" aria-modal="true"
     data-i18n-aria-label="listsAddPlace" aria-label="Add a place" hidden>
  <div class="picker card" id="picker">
    <button type="button" class="panel-close" id="picker-close"
            data-i18n-aria-label="close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h2 class="picker-title" data-i18n="listsAddPlace">Add a place</h2>
    <div class="search">
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/>
        </svg>
        <input type="search" class="search-input" id="picker-search" autocomplete="off"
               autocorrect="off" autocapitalize="none" spellcheck="false"
               data-i18n-aria-label="listsSearchPlaces" data-i18n-placeholder="listsSearchHint"
               aria-label="Search every place in Tallinn" placeholder="Name or street">
        <button type="button" class="search-clear" id="picker-clear"
                data-i18n-aria-label="searchClear" aria-label="Clear the search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="picker-body" id="picker-body" aria-live="polite"></div>
  </div>
</div>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<!-- Where a move says itself. Carrying a row is obvious on a screen and silent
     without one, so the new position is written in here and read out. It is in
     the page rather than built with the list because a live region inserted and
     filled in the same breath is not announced. -->
<p class="lists-live" id="lists-live" role="status" aria-live="polite"></p>

<noscript>
  <div class="noscript card">
    <p class="eyebrow">Tallinn</p>
    <h2>Lists</h2>
    <p>A list is built and read with JavaScript. The map itself works rather
      better than this page does without it — <a href="/">it is over here</a>.</p>
  </div>
</noscript>

<!-- The basemap the "add a place" picker draws, shared with the map page.
     Before lists.js and deferred like it, so document order puts the global
     in place first. It is the only part of the map this page loads eagerly —
     Leaflet itself is still fetched only when the picker is opened. -->
<script src="/assets/basemap.js?v=bf2dd374" defer></script>
<!-- The radio, shared with the map: the station carries across the walk from
     one page to the other. Before lists.js and deferred like it, the same way
     the basemap is. -->
<script src="/assets/radio.js?v=495775d6" defer></script>
<script src="/assets/lists.js?v=be4a034d" defer></script>
</body>
</html>
