<!doctype html>
<meta charset="utf-8">
<title>The station follows you — clip</title>
<meta name="clip" content="ms=4200; w=480; h=270">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Literata:opsz,wght@7..72,400..600&amp;display=block">
<link rel="stylesheet" href="../../assets/styles.css">
<link rel="stylesheet" href="scene.css">
<style>
  /* One button, in the middle of the stage where the rail would have it, and
     the station it is playing. */
  .rail { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); }
  .bars { position: absolute; left: 0; right: 0; top: 168px; display: flex; justify-content: center; gap: 5px; align-items: flex-end; height: 34px; }
  .bars i { display: block; width: 5px; border-radius: 3px; background: var(--accent); }
  .note {
    position: absolute; left: 0; right: 0; top: 214px;
    text-align: center;
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); text-shadow: var(--glow);
  }
</style>
<script src="scene.js"></script>
<script>
Clip.scene({
  build: function (stage, clip) {
    Clip.ground(stage, clip.w, clip.h);

    var rail = document.createElement('div');
    rail.className = 'rail';
    rail.innerHTML =
      '<button type="button" class="rail-btn radio" aria-pressed="false">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<path class="ico-play" d="M8 5.5l11 6.5-11 6.5z"/>' +
          '<path class="ico-stop" d="M8 6.5h3v11H8zM13 6.5h3v11h-3z"/>' +
        '</svg><span class="radio-name rail-label">Raadio Tallinn</span>' +
      '</button>';
    stage.appendChild(rail);

    var bars = document.createElement('div');
    bars.className = 'bars';
    bars.innerHTML = '<i></i><i></i><i></i><i></i><i></i>';
    stage.appendChild(bars);

    var note = document.createElement('p');
    note.className = 'note';
    note.textContent = 'and it keeps playing on the next page';
    stage.appendChild(note);

    return {
      btn: rail.querySelector('.rail-btn'),
      bars: bars.querySelectorAll('i'),
      note: note,
      cursor: Clip.cursor(stage)
    };
  },

  /* Press once and the station is on \u2014 the pill takes its name, the stop
     mark replaces the play triangle, and it stays on when you walk to another
     page, which is the bit the sentence underneath has to say in words. */
  at: function (t, h) {
    var on = t >= 1500;
    h.btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    h.btn.classList.toggle('hint-open', on);

    for (var i = 0; i < h.bars.length; i++) {
      var tall = on ? 8 + 24 * (0.5 + 0.5 * Math.sin((t / 150) + i * 1.3)) : 6;
      h.bars[i].style.height = tall.toFixed(1) + 'px';
      h.bars[i].style.opacity = on ? '1' : '.25';
    }

    h.note.style.opacity = String(Clip.at(t, 2600, 3200));

    var x = Clip.lerp(t, 150, 1350, 400, 240);
    var y = Clip.lerp(t, 150, 1350, 236, 122);
    h.cursor.to(x, y, { t: t, from: 1400, to: 1700 });
    h.cursor.tap(240, 120, 70, Clip.at(t, 1460, 2100));
  }
});
</script>
