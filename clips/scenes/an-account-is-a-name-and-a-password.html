<!doctype html>
<meta charset="utf-8">
<title>An account is a name and a password — clip</title>
<meta name="clip" content="ms=4600; w=480; h=270">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Literata:opsz,wght@7..72,400..600&amp;display=block">
<link rel="stylesheet" href="../../assets/styles.css">
<link rel="stylesheet" href="scene.css">
<style>
  /* The sheet the map signs people in on, at the size a stage has room for.
     Every part of it is the map's own: .ac-field, .ac-label, .ac-warn and the
     one filled action. Two fields is the whole form, which is the post. */
  .sheet {
    position: absolute;
    left: 50%;
    top: 22px;
    width: 340px;
    padding: 16px 20px 16px;
    /* Stood back from rather than squeezed. A field on this site is 16px
       because anything smaller makes iOS zoom the page, so the sheet is drawn
       at the size it really is and the whole of it scaled to fit the stage —
       which keeps every proportion in it the site's own. */
    transform: translateX(-50%) scale(.75);
    transform-origin: top center;
  }
  .sheet h2 {
    font-family: var(--display);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -.02em;
    margin: 4px 0 12px;
  }
  .sheet .ac-field { margin-bottom: 10px; }
  .sheet input { pointer-events: none; }
  .sheet .ac-warn { margin-bottom: 0; }
</style>
<script src="scene.js"></script>
<script>
Clip.scene({
  build: function (stage) {
    var sheet = document.createElement('div');
    sheet.className = 'sheet account card';
    sheet.innerHTML =
      '<h2>Make an account</h2>' +
      '<label class="ac-field"><span class="ac-label">Username</span>' +
        '<input type="text" value=""></label>' +
      '<label class="ac-field"><span class="ac-label">Password</span>' +
        '<input type="text" value=""></label>' +
      '<p class="ac-warn" role="note">' +
        '<span class="ac-warn-ico" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" focusable="false"><path d="M12 3.5 21 19.5H3z"/>' +
          '<path d="M12 10v4"/><circle cx="12" cy="16.7" r=".9"/></svg>' +
        '</span>' +
        '<span>Forget it and nobody can give it back.</span>' +
      '</p>';
    stage.appendChild(sheet);

    var fields = sheet.querySelectorAll('input');
    return { user: fields[0], pass: fields[1], warn: sheet.querySelector('.ac-warn') };
  },

  /* A name, a password, and the sentence that says what it costs to forget
     it. There is no third field, no address, and nothing else to fill in \u2014
     which is the whole of what an account here holds. */
  at: function (t, h) {
    var name = 'kaisa';
    var typed = Math.round(Clip.at(t, 500, 1500) * name.length);
    h.user.value = name.slice(0, typed);

    var dots = Math.round(Clip.at(t, 1800, 2700) * 11);
    h.pass.value = new Array(dots + 1).join('\u2022');

    /* And then the sentence that says what it costs to forget the second of
       them, which on this site arrives before the button rather than after
       it. There is no third field, no address, and nothing else to fill in. */
    h.warn.style.opacity = String(Clip.at(t, 2900, 3150));
  }
});
</script>
