<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discount | Tallinn Tastebuds</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7ddd4">

<!-- Analytics: Google and Microsoft Clarity, both from one file rather than
     two snippets pasted into every head. assets/analytics.js holds the ids and
     the consentv2 signal Clarity needs, and its head carries the reasoning of
     the consent bar that stood in front of both of them for a day. -->
<script src="assets/analytics.js?v=a44b6b90" defer></script>

<!-- Not part of the public map. These pages only mean anything with a place
     in the query string, and a search result for a bare one would be a dead
     end, so they stay out of the index. robots.txt says the same thing. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/logo/icon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="assets/logo/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="assets/logo/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/logo/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Literata:opsz,wght@7..72,400..600&amp;display=swap">

<link rel="stylesheet" href="assets/styles.css?v=f793467a">
<link rel="stylesheet" href="assets/pass.css?v=d105e325">
</head>
<body>

<main class="pass-page">
  <a class="pass-brand" href="./" data-track="home">
    <img class="pass-mark" src="assets/logo/mark.webp" alt="" width="60" height="46">
    <p class="eyebrow">Tallinn</p>
    <p class="pass-wordmark">Tallinn Tastebuds</p>
  </a>

  <!-- data-clarity-mask keeps the code and its QR out of a Clarity replay,
       and is inherited by everything drawn under it. Tidiness rather than a
       lock: the keys ship in data/deals.json, which is public, and the hourly
       rebuild is what actually defends the code — see "And it is a door, not
       a lock" under "It is for members" in README.md. But a code has no reason
       to travel to a third party to heatmap a page whose only button is the
       way back. -->
  <section class="card pass-card" id="card" aria-live="polite" data-clarity-mask="true"></section>
</main>

<!-- What every press reports to Google Analytics, shared by every page.
     Before the page's own script and deferred like it, so document order puts
     the global in place first. -->
<script src="assets/track.js?v=1783fa58" defer></script>
<script src="assets/qr.js?v=77d83001" defer></script>
<script src="assets/pass.js?v=2e05117d" defer></script>
<script src="assets/deal.js?v=776a046c" defer></script>
</body>
</html>
