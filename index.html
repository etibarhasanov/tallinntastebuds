<!-- The mouth, cropped square out of the painting in
     assets/logo/source-artwork.jpg. Raster all the way down: the mark is a
     watercolour, so there is no vector of it to hand a browser.

     Every side here is 16, 48 or a multiple of 48, because Google will only
     put a favicon beside a search result if it is square at a multiple of
     48px — a 32px file, which is what this list used to lead with, gets the
     grey globe instead. /favicon.ico carries the same crop at the path
     Google falls back to when it cannot read the tags at all. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/logo/icon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="assets/logo/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="assets/logo/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/logo/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Literata:opsz,wght@7..72,400..600&amp;display=swap">

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<link rel="stylesheet" href="assets/styles.css?v=ef96c575">
</head>
<body>

<a class="skip-link" href="#panel-list" data-i18n="skipToList">Skip to the list of places</a>

<div id="map" role="application" data-i18n-aria-label="mapLabel" aria-label="Map of approved places in Tallinn"></div>

<header class="brand" id="brand">
  <!-- No "Tallinn" eyebrow over the top: the name under it already opens with
       the word. The list panel keeps its own, where nothing else says it. -->
  <div class="brand-head">
    <img class="brand-mark" src="assets/logo/mark-round.webp" alt="" width="66" height="66">
    <h1 class="wordmark" data-i18n="wordmark">Tallinn Tastebuds</h1>
  </div>
  <p class="tagline" data-i18n="tagline">All the places in this map I have personally been and approved.</p>
  <a class="ig-link"
     href="https://www.instagram.com/tallinntastebuds/"
     target="_blank"
     rel="noopener"
     data-i18n="instagramHandle"
     data-i18n-aria-label="instagramLabel">@tallinntastebuds</a>
</header>

<div class="rail" id="rail">
  <div class="styles" id="styles" role="group" data-i18n-aria-label="styleLabel" aria-label="Colour"></div>
  <button type="button" class="dice radio" id="btn-radio" aria-pressed="false" hidden
          data-i18n-title="radioPlay" data-i18n-aria-label="radioPlay"
          aria-label="Play the radio" title="Play the radio">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="ico-play" d="M8 5.5l11 6.5-11 6.5z"/>
      <path class="ico-stop" d="M8 6.5h3v11H8zM13 6.5h3v11h-3z"/>
    </svg>
    <span class="radio-name" id="radio-name"></span>
  </button>
  <button type="button" class="dice" id="btn-random" data-i18n-title="randomPick" data-i18n-aria-label="randomPick" aria-label="Surprise me" title="Surprise me">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="4" y="4" width="16" height="16" rx="4"/>
      <circle cx="9" cy="9" r="1.35" class="pip"/>
      <circle cx="12" cy="12" r="1.35" class="pip"/>
      <circle cx="15" cy="15" r="1.35" class="pip"/>
    </svg>
    <span class="dice-label" data-i18n="randomPick">Surprise me</span>
  </button>
  <div class="locate-dock card seg" id="locate-dock">
    <button type="button" class="btn btn-icon" id="btn-locate" data-i18n-aria-label="locate" aria-label="Show my location">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.2" fill="none"/><path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3"/></svg>
    </button>
  </div>
</div>

<div class="controls">
  <div class="seg" id="lang-switch" role="group" data-i18n-aria-label="language" aria-label="Language"></div>
  <div class="seg">
    <button type="button" class="btn btn-wide" id="btn-list" aria-expanded="false" aria-controls="panel">
      <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/>
      </svg>
      <span data-i18n="listOpen">List</span>
    </button>
  </div>
</div>

<div class="filter-bar" id="filter-bar">
  <button type="button" class="chip filter-toggle" id="btn-filters" aria-expanded="false" aria-controls="filters">
    <svg class="filter-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M4 7h16M7 12h10M10.5 17h3"/>
    </svg>
    <span data-i18n="filtersButton">Filters</span>
  </button>
  <nav class="filters" id="filters" data-i18n-aria-label="filters" aria-label="Filter by type"></nav>
</div>

<aside class="panel card" id="panel" aria-labelledby="panel-list-title">
  <div class="sheet-grip" id="sheet-grip" role="button" tabindex="0" aria-expanded="false"
       data-i18n-aria-label="sheetResize" aria-label="Drag to resize the sheet"></div>
  <button type="button" class="panel-close" id="panel-close" data-i18n-aria-label="close" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="panel-scroll" id="panel-scroll">
    <article id="panel-detail" hidden></article>
    <section id="panel-list">
      <div class="list-head">
        <p class="eyebrow" data-i18n="eyebrow">Tallinn</p>
      </div>
      <div class="search">
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/>
          </svg>
          <input type="search" class="search-input" id="list-search" autocomplete="off"
                 autocorrect="off" autocapitalize="none" spellcheck="false"
                 data-i18n-aria-label="search" data-i18n-placeholder="searchPlaceholder"
                 aria-label="Search places" placeholder="Name, street or dish">
          <button type="button" class="search-clear" id="search-clear"
                  data-i18n-aria-label="searchClear" aria-label="Clear the search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
      <div id="list-body"></div>
    </section>
  </div>
</aside>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" data-i18n-aria-label="photos" aria-label="Photos" hidden>
  <button type="button" class="lb-btn lb-close" id="lb-close" data-i18n-aria-label="photoClose" aria-label="Close photo">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button type="button" class="lb-btn lb-prev" id="lb-prev" data-i18n-aria-label="photoPrev" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <figure class="lb-figure">
    <img id="lb-img" alt="">
    <figcaption class="mono" id="lb-caption"></figcaption>
  </figure>
  <button type="button" class="lb-btn lb-next" id="lb-next" data-i18n-aria-label="photoNext" aria-label="Next photo">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<noscript>
  <div class="noscript card">
    <p class="eyebrow">Tallinn</p>
    <h2>Tallinn Tastebuds</h2>
    <p>This map needs JavaScript to draw itself. The full list of places lives in
      <a href="data/restaurants.json">data/restaurants.json</a>.</p>
  </div>
</noscript>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
        defer></script>
<!-- Shared with deal.html, verify.html and staff.html. The map uses only the
     lookup and date helpers from it, to work out whether a place has a
     discount worth showing; with no deals set up that answer is always no. -->
<script src="assets/pass.js?v=41008114" defer></script>
<script src="assets/app.js?v=542fa9cb" defer></script>
</body>
</html>
