<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The public half of a Cloudflare Turnstile widget, which is the layer that
     stops scripts rather than people from running the save count up. Empty
     means off: assets/app.js does not load Turnstile at all, the save still
     works, and the cap in functions/api/saves.js carries it alone. Paste the
     site key here and set TURNSTILE_SECRET in the Pages project to turn it
     on — nothing else changes. -->
<meta name="turnstile-key" content="">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7ddd4">
<meta name="robots" content="index, follow">

<!-- Analytics: Google and Microsoft Clarity, both from one file rather than
     two snippets pasted into every head. assets/analytics.js holds the ids and
     the consentv2 signal Clarity needs, and its head carries the reasoning of
     the consent bar that stood in front of both of them for a day. -->
<script src="assets/analytics.js?v=b106a66c" defer></script>

<!-- The block between the two PAGE-HEAD markers below is the English head,
     and it is what a browser gets only when functions/index.js could not do
     its job. On every ordinary request that route serves this same file with
     the block replaced by the head for the address: the title and the
     description in the language ?lang= names, a canonical tag naming that
     address, an hreflang link to each of the ten, the card, and the JSON-LD
     block describing every open place with its write-up in that language —
     or, when ?spot= names a place, that place's own title, its write-up, its
     photograph for the card and a JSON-LD block for it alone, so a link
     somebody sends about one restaurant arrives as that restaurant and a
     search for it lands on its own page. What is outside the markers — the
     robots tag, the icons, the styles — is the same at every address and
     stays put.

     Same markers, same mechanism, as lists.html and split.html, and the same
     warning: the markers are spelled out only on the two lines that mark
     something, never inside this comment, because HTML comments do not nest
     and one written in here would end this comment early and drop the rest of
     it into the page as text. It happened. -->
<!--PAGE-HEAD-->
<title>Where to eat in Tallinn: restaurants, cafés, bakeries and beer bars | Tallinn Tastebuds</title>
<meta name="description" content="A hand picked map of restaurants, cafés, bakeries, pubs and beer bars in Tallinn I have been to myself and approved. No scores: being on the map is the verdict.">
<link rel="canonical" href="https://tallinntastebuds.ee/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tallinntastebuds.ee/">
<meta property="og:site_name" content="Tallinn Tastebuds">
<meta property="og:title" content="Where to eat in Tallinn: restaurants, cafés, bakeries and beer bars | Tallinn Tastebuds">
<meta property="og:description" content="All the places in this map I have personally been and approved.">
<meta property="og:image" content="https://tallinntastebuds.ee/assets/logo/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A watercolour painting of an open, grinning mouth beside the words Tallinn Tastebuds and the line: all the places in this map I have personally been and approved.">
<meta name="twitter:card" content="summary_large_image">
<!--/PAGE-HEAD-->

<!-- The mouth, cropped square out of the painting in
     assets/logo/source-artwork.jpg. Raster all the way down: the mark is a
     watercolour, so there is no vector of it to hand a browser.

     Every side here is 16, 48 or a multiple of 48, because Google will only
     put a favicon beside a search result if it is square at a multiple of
     48px — a 32px file, which is what this list used to lead with, gets the
     grey globe instead. /favicon.ico carries the same crop at the path
     Google falls back to when it cannot read the tags at all. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/logo/icon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="assets/logo/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="assets/logo/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/logo/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Literata:opsz,wght@7..72,400..600&amp;display=swap">

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<link rel="stylesheet" href="assets/styles.css?v=107526e4">
</head>
<body>

<a class="skip-link" href="#panel-list" data-i18n="skipToList">Skip to the list of places</a>

<div id="map" role="application" data-i18n-aria-label="mapLabel" aria-label="Map of approved places in Tallinn"></div>

<header class="brand" id="brand">
  <!-- No "Tallinn" eyebrow over the top: the name under it already opens with
       the word. The list panel keeps its own, where nothing else says it. -->
  <div class="brand-head">
    <img class="brand-mark" src="assets/logo/mark-round.webp" alt="" width="66" height="66">
    <!-- The name is the way home, here as it is on every other page: back to
         the whole map from a place, a list, a type or a story. The mark beside
         it is the stories and nothing else, so the two things in this corner
         are two doors rather than one door and a picture that turns into
         another. -->
    <h1 class="wordmark"><a class="brand-home" href="/" data-track="home" data-i18n="wordmark">Tallinn Tastebuds</a></h1>
  </div>
  <p class="tagline" data-i18n="tagline">All the places in this map I have personally been and approved.</p>
  <a class="ig-link" data-track="instagram"
     href="https://www.instagram.com/tallinntastebuds/"
     target="_blank"
     rel="noopener"
     data-i18n="instagramHandle"
     data-i18n-aria-label="instagramLabel">@tallinntastebuds</a>
</header>

<div class="rail" id="rail">
  <!-- Who you are, first. Everything under it is about this visit — a place
       for tonight, a station, a colour, where you are standing — and the
       account is the one button that says the saves outlast the visit. It
       also wears a name once there is one, which is the rail telling you
       whose list you are looking at before you go looking for it.

       Hidden until /api/account says accounts are actually bound — see
       paintAccountButton in assets/app.js, which is also what holds the
       introduction below open for it. -->
  <button type="button" class="rail-btn" id="btn-account"
          data-i18n-title="accountOpen" data-i18n-aria-label="accountOpen"
          aria-label="Account" title="Account" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="8.4" r="3.6"/>
      <path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/>
    </svg>
    <span class="rail-label" id="account-label" data-i18n="accountOpen">Account</span>
  </button>
  <!-- Then everybody else. The account and this are the same half of the site
       — who you are, and what other people have written — so they stand
       together at the head of the rail, above the buttons that are about
       tonight. The map had no way to a list at all until this: the only door
       was your own account page, so a stranger never learnt lists existed.
       That page has no door either now, which leaves this one and the bar at
       the foot of a list. See "One door to the lists" under Lists in
       README.md, which is the decision this reverses and why.

       An <a> and not a button, because the directory is an address somebody
       can open in a tab or send — the same reason the List half of the switch
       on a list's band is a link. It reports lists_all through data-track,
       which is the name the bar at the foot of a list reports too — and the
       card on /account.html reported for as long as there was one: one door,
       one name, wherever it is drawn.

       A clipboard, where the rest of the rail draws a line. It wore the map
       pin the lists themselves wear for a day, and over a map of pins that
       said "a pin" rather than "the lists" — see .rail-glyph in
       assets/styles.css, which is the disc it sits on. Written here like
       every other icon on this rail rather than painted by a script: it is
       this door's picture, not a list's own marker, and nothing in
       assets/pins.js has an opinion about it.

       Hidden until /api/account says the database behind the lists is
       bound — a door onto "Lists are switched off on this copy of the site"
       is a button that can only disappoint. -->
  <a class="rail-btn" id="btn-lists" href="/lists" data-track="lists_all"
     data-i18n-title="listsAllWhy" data-i18n-aria-label="listsAllTitle"
     title="The most saved first. Search them, save the ones you like."
     aria-label="Everybody’s lists" hidden>
    <span class="rail-glyph" aria-hidden="true">📋</span>
    <span class="rail-label" data-i18n="listsAllTitle">Everybody’s lists</span>
  </a>
  <!-- The other thing on this site that is not about tonight's dinner: a
       door onto flashcard.tallinntastebuds.ee, and now the only one
       anywhere. The first was a row on /account.html, behind a sign-in, and
       for a while it was the whole of the way in — which meant a stranger on
       the map never learnt the decks existed at all. This pill answered
       that, and the row went once it had: a page of your own things does not
       need to carry a door the map already carries, and the one everybody
       sees is worth more than the one you have to sign in to reach. See "How
       it is found, which is one pill" under Flashcards in README.md.

       It wears flashDoor and flashDoorWhy, which were the account row's
       strings first and are in all ten languages. flash_open_rail is what it
       reports; flash_open_account went with the row.

       An <a> and not a button, for the reason the lists door above is one:
       /flashcard is an address somebody can open in a tab or send. It
       carries no ?d=, so it lands on the list of decks rather than
       presuming which one somebody came for, and it points at the path
       rather than the subdomain, which is what lets the language and the
       station follow along — see "It is the same account as the map" and
       "And a radio while you learn it" under Flashcards.

       Never hidden, unlike the account and lists doors above it: those wait
       on /api/account because a list or an account with no database behind
       it is a door onto nothing, and this page works with no database bound
       at all — functions/flashcard.js draws the shipped decks straight out
       of data/decks.json.

       Two overlapping cards, not the clipboard the lists door wears or an
       emoji: there is no glyph on this map for "a deck of Estonian" the way
       📋 already meant "a pin" before it meant "the lists", so this one is
       drawn in the rail's own line style instead, like every icon above and
       below it. -->
  <a class="rail-btn" id="btn-flash" href="/flashcard" data-track="flash_open_rail"
     data-i18n-title="flashDoorWhy" data-i18n-aria-label="flashDoor"
     title="Decks of the words, and the ones you collect yourself."
     aria-label="Learn Estonian">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="3.5" y="6.5" width="13" height="11" rx="2"/>
      <path d="M8 3.6l11.5 3-3 11"/>
    </svg>
    <span class="rail-label" data-i18n="flashDoor">Learn Estonian</span>
  </a>
  <!-- Then what the rail does, before what the rail looks like. Surprise me
       is the one button here that *does* something to the evening; the
       colour swatch and "where am I" are settings, and settings belong under
       the things they settle. On a phone that order is the whole point: the
       buttons at the top are the ones that introduce themselves first. -->
  <button type="button" class="rail-btn" id="btn-random" data-i18n-title="randomPick" data-i18n-aria-label="randomPick" aria-label="Surprise me" title="Surprise me">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="4" y="4" width="16" height="16" rx="4"/>
      <circle cx="9" cy="9" r="1.35" class="pip"/>
      <circle cx="12" cy="12" r="1.35" class="pip"/>
      <circle cx="15" cy="15" r="1.35" class="pip"/>
    </svg>
    <span class="rail-label" data-i18n="randomPick">Surprise me</span>
  </button>
  <!-- Next to Surprise me, because the two are the same button with the
       question turned round: one answers "anywhere, you choose", the other
       "somewhere like this". Both hand back a place with the map still under
       it, and neither is a filter — see the answer mode in assets/app.js. -->
  <button type="button" class="rail-btn" id="btn-ask" data-i18n-title="askOpen" data-i18n-aria-label="askOpen" aria-label="Ask" title="Ask">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20.5 12.4c0 3.9-3.8 7-8.5 7-1 0-2-.15-2.9-.4L4 20.5l1.6-3.7a6.5 6.5 0 0 1-2.1-4.4c0-3.9 3.8-7 8.5-7s8.5 3.1 8.5 7z"/>
      <circle cx="8.6" cy="12.4" r="1.15" class="pip"/>
      <circle cx="12" cy="12.4" r="1.15" class="pip"/>
      <circle cx="15.4" cy="12.4" r="1.15" class="pip"/>
    </svg>
    <span class="rail-label" data-i18n="askOpen">Ask</span>
  </button>
  <div class="styles" id="styles" role="group" data-i18n-aria-label="styleLabel" aria-label="Colour"></div>
  <button type="button" class="rail-btn" id="btn-locate" data-i18n-aria-label="locate" aria-label="Show my location">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.2" fill="none"/><path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3"/></svg>
    <!-- The button keeps its own aria-label, so the words are decoration to a
         reader rather than a second name for the same control.

         It stands here in the markup and in the rail's own order, and below
         860px the stylesheet draws it in the bottom-right corner of the map
         instead — where a phone expects it and where the thumb panning the
         city already is. It stays a child of the rail so that the press
         counter, the introduction cascade and the walk all still find it. -->
    <span class="rail-label" data-i18n="locate" aria-hidden="true">Show my location</span>
  </button>
  <!-- Last, and the one that is about the rest: what this map is and what
       the buttons above it do, on demand. The page already says all of it on
       arrival — the tagline under the mark, the labels down the rail — but
       only once, and only for a few seconds, and a visitor who landed on a
       place or was looking at the pins gets a map that never introduced
       itself. This is the introduction for the asking. -->
  <button type="button" class="rail-btn" id="btn-explain" data-i18n-title="explainOpen" data-i18n-aria-label="explainOpen" aria-label="How this works" title="How this works">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="8.4"/>
      <path d="M9.6 9.7a2.4 2.4 0 1 1 3.4 2.2c-.7.35-1 .8-1 1.5v.5"/>
      <circle cx="12" cy="16.6" r="1.1" class="pip"/>
    </svg>
    <span class="rail-label" data-i18n="explainOpen">How this works</span>
  </button>
  <!-- And after it, the other half of the same conversation. "How this works"
       is the site explaining itself; this is the site asking. The two stand
       together at the foot because neither is about tonight — everything
       above them answers a question about where to eat, and these two answer
       a question about the map itself.

       An <a> and not a button, for the reason the lists door is one: /feedback
       is an address somebody can open in a tab or send to somebody else.

       Never hidden, unlike the two doors at the head of the rail. Those wait
       on /api/account because a list with no database behind it is a page
       with nothing on it at all; this page draws its title, its sentence and
       its field out of data/ui.json alone and says for itself when the
       feedback could not be read — which is a state it has on a perfectly
       healthy deployment whenever a request does not come back.

       IT TAKES THE LAST SLOT ON THE RAIL, AND THERE IS NOT ANOTHER ONE.
       The cascade that introduces these pills on a phone opens them 300ms
       apart and holds each for 4.2s against a sentence under the mark that is
       up for 7.86s. At eight pills the last one collapsed at 7.45s; at nine
       it collapses at 7.75s, which still lands inside the sentence with a
       tenth of a second to spare. A tenth button would not, and the rail
       would be talking over a sentence that has gone. See introduceRail() in
       assets/app.js, where those numbers are. -->
  <a class="rail-btn" id="btn-feedback" href="/feedback" data-track="feedback_open"
     data-i18n-title="feedbackWhy" data-i18n-aria-label="feedbackTitle"
     title="What you would change about this site." aria-label="Feedback">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20.5 12.4c0 3.9-3.8 7-8.5 7-1 0-2-.15-2.9-.4L4 20.5l1.6-3.7a6.5 6.5 0 0 1-2.1-4.4c0-3.9 3.8-7 8.5-7s8.5 3.1 8.5 7z"/>
      <path d="M15.1 9.6a2.6 2.6 0 0 0-3.1 0L12 9.7l-.1-.1a2.6 2.6 0 0 0-3.1 0 2.1 2.1 0 0 0 0 3.2L12 15.7l3.1-2.9a2.1 2.1 0 0 0 0-3.2z" class="pip"/>
    </svg>
    <span class="rail-label" data-i18n="feedbackTitle">Feedback</span>
  </a>
</div>

<div class="controls">
  <div class="seg" id="lang-switch" role="group" data-i18n-aria-label="language" aria-label="Language"></div>
  <!-- Next to the language rather than down the rail with the buttons that
       change the evening: it wears the map's own pill, the same one the
       lists, account, blog, feedback and flashcards pages already stand it
       beside their own language switch — one design for the button rather
       than a second one for the corner it used to keep. It left the rail's
       arrival cascade with it: HINT_KEYS in assets/app.js no longer opens
       its label on the way in, because a pill flashing open up here while
       the rail explains itself down the left reads as two introductions
       rather than one. Pressing play still opens the station's name for a
       few seconds — see the radio's own onchange in assets/app.js — so
       nothing about starting it changed, only where it stands while off.
       Hidden until data/radio.json is read, and for good if there is no
       station in it. -->
  <button type="button" class="rail-btn radio" id="btn-radio" aria-pressed="false" hidden
          data-i18n-title="radioPlay" data-i18n-aria-label="radioPlay"
          aria-label="Play the radio" title="Play the radio">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="ico-play" d="M8 5.5l11 6.5-11 6.5z"/>
      <path class="ico-stop" d="M8 6.5h3v11H8zM13 6.5h3v11h-3z"/>
    </svg>
    <span class="radio-name rail-label" id="radio-name"></span>
  </button>
  <!-- The way into the list, and a phone's alone. Above 860px the places
       column is open from the moment the map draws and never shuts, so a
       button that opens it is a button that is always already pressed — see
       "the places column is always up" in assets/styles.css, which is what
       takes this out of the corner up there. -->
  <div class="seg" id="list-seg">
    <button type="button" class="btn btn-wide" id="btn-list" aria-expanded="false" aria-controls="panel">
      <!-- A pin, not the magnifier that used to be here. The button says
           Places now, and a magnifier over that word offers to search
           something the button has not shown you yet. The search field is
           still the first thing inside the panel, which is where it can
           actually be used. -->
      <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 21.2c4.3-4.2 6.4-7.5 6.4-10.2a6.4 6.4 0 1 0-12.8 0c0 2.7 2.1 6 6.4 10.2z"/>
        <circle cx="12" cy="10.6" r="2.3"/>
      </svg>
      <span data-i18n="listOpen">Places</span>
    </button>
  </div>
</div>

<div class="filter-bar" id="filter-bar">
  <button type="button" class="chip filter-toggle" id="btn-filters" aria-expanded="false" aria-controls="filters">
    <svg class="filter-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M4 7h16M7 12h10M10.5 17h3"/>
    </svg>
    <span data-i18n="filtersButton">Filters</span>
  </button>
  <nav class="filters" id="filters" data-i18n-aria-label="filters" aria-label="Filter by type"></nav>
</div>

<aside class="panel card" id="panel" aria-labelledby="panel-list-title">
  <div class="sheet-grip" id="sheet-grip" role="button" tabindex="0" aria-expanded="false"
       data-i18n-aria-label="sheetResize" aria-label="Drag to resize the sheet"></div>
  <button type="button" class="panel-close" id="panel-close" data-i18n-aria-label="close" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <!-- The bookmark, and next to it how many other people have kept this place.
       Pressing it saves the place; the number says how many others saved it
       too. One action doing both jobs, which is only honest because a save
       here is anonymous — nobody can see whose it was — so the reason
       Instagram and X keep a public like apart from a private bookmark does
       not apply. In the
       panel's chrome rather than in the write-up under it: the write-up is
       rebuilt on every language switch and scrolls away, and the one thing on
       this panel you act on should do neither.

       Drawn only on a place — there is no one place to save from a list of
       seventy — which assets/app.js decides in renderPanel alongside
       everything else that turns on the view.

       A toggle keeps one name and flips aria-pressed under it; it does not
       rename itself to the opposite of what it is. The count rides in its own
       span so it can change without the label being rebuilt, and it is
       spelled into the button's label for anybody who cannot see it. -->
  <button type="button" class="panel-save" id="panel-save" aria-pressed="false"
          aria-label="Save this place" title="Save this place" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    <span class="save-n" id="panel-save-n" aria-hidden="true"></span>
  </button>
  <!-- The link to this place, handed over. functions/index.js has served every
       ?spot= address its own unfurl card and its own title for a while now —
       the place's name, its write-up and its first photograph, rather than the
       map's card repeated seventy-six times — and the only way to get one of
       those links was to read it out of the address bar. On a phone, inside
       the browser Facebook or Instagram opens a link in, that is not a thing
       anybody does.

       Between the close and the mark, and that order is not arbitrary: this
       button is always exactly its own width, while the mark grows leftwards
       as the count it carries gets longer. The fixed one takes the anchor
       nearer the edge so the growing one never has to be measured.

       Drawn on a place and on nothing else, like the mark beside it, and not
       on a stand-in — assets/app.js says why in paintShare(). -->
  <button type="button" class="panel-share" id="panel-share"
          aria-label="Share" title="Share" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 15V4"/>
      <path d="M8 8l4-4 4 4"/>
      <path d="M5 13v5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-5"/>
    </svg>
  </button>
  <!-- Which list the map is showing, and the switch to its own page. Empty and
       hidden on the map's own list of places; filled by renderBand() in
       assets/app.js the moment a list becomes the map's mode.

       Above the scroll rather than inside it, which is the whole of why it is
       here in the markup instead of being built with the rows. It is the one
       thing on this panel that is true of the panel rather than of anything in
       it, so it holds the top of the sheet without depending on where the
       scroll happens to be — and that is what lets a list have a stop under
       the low one to sit at. -->
  <div class="panel-band" id="panel-band" hidden></div>
  <div class="panel-scroll" id="panel-scroll">
    <article id="panel-detail" hidden></article>
    <!-- The chat. It reads top to bottom the way a conversation does: the
         site speaks first and asks what you feel like, then every question
         sits on the right with the answer under it, and the field is the
         last thing, held to the bottom of the panel so the way to ask again
         is always in reach. Built by renderAsk() in assets/app.js; the
         opening line and the field are static so the language switch
         relabels them with everything else. Closing the panel clears the
         thread, the way closing a chat does. -->
    <section id="panel-ask" hidden>
      <div class="ask-head">
        <p class="eyebrow" data-i18n="eyebrow">Tallinn</p>
      </div>
      <h2 class="ask-title" id="panel-ask-title" tabindex="-1" data-i18n="askOpen">Ask</h2>
      <div class="ask-thread" id="ask-thread">
        <!-- The first thing said, and the site says it. It used to be a
             question of its own — this map, or all of Tallinn — with two
             buttons for the reply and nothing typeable until one was
             pressed. Every question is asked of both at once now, my places
             first and Google's city where the map has nothing, so the site
             opens on the one thing it actually needs to know. -->
        <article class="ask-turn">
          <p class="ask-say" data-i18n="askTitle">What do you feel like?</p>
        </article>
      </div>
      <!-- The field, at the bottom where a chat's is. It used to sit in the
           list panel above the search, which made it read as a second search
           that was oddly slow; a question for an evening you cannot name is
           not a search, so it has a panel of its own now, with the thread
           of what was asked above it.

           maxlength is the same 200 functions/api/ask.js cuts a question to.
           Restated here, like every other cap on this site, so the field
           stops you rather than the server silently trimming what you typed. -->
      <form class="ask" id="ask-form">
        <div class="ask-field">
          <svg class="ask-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.5 12.4c0 3.9-3.8 7-8.5 7-1 0-2-.15-2.9-.4L4 20.5l1.6-3.7a6.5 6.5 0 0 1-2.1-4.4c0-3.9 3.8-7 8.5-7s8.5 3.1 8.5 7z"/>
          </svg>
          <input type="text" class="ask-input" id="ask-input" autocomplete="off"
                 autocorrect="off" spellcheck="false" maxlength="200"
                 data-i18n-aria-label="askTitle" data-i18n-placeholder="askPlaceholder"
                 aria-label="What do you feel like?" placeholder="cheap ramen, open now">
          <button type="submit" class="ask-go" id="ask-go"
                  data-i18n-aria-label="askSend" aria-label="Ask">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M5 12h13M12 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
      </form>
    </section>
    <section id="panel-list">
      <div class="search">
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/>
          </svg>
          <input type="search" class="search-input" id="list-search" autocomplete="off"
                 autocorrect="off" autocapitalize="none" spellcheck="false"
                 data-i18n-aria-label="search" data-i18n-placeholder="searchPlaceholder"
                 aria-label="Search places" placeholder="Name or street">
          <button type="button" class="search-clear" id="search-clear"
                  data-i18n-aria-label="searchClear" aria-label="Clear the search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
      <!-- Empty here, and full as served: functions/index.js writes every open
           place into it as an ordinary list — name, kinds, address, write-up,
           the dishes to order, in the language of the address — for the
           readers that run no script, which is every AI assistant's fetcher
           and Bing on a bad day; at a ?spot= address the place itself comes
           first and whole, and the rest by name. renderList() in
           assets/app.js empties it before drawing the first row, and the
           panel is closed until the script opens it, so nobody ever sees the
           plain version. The spelling of this one line is what fill() in
           functions/_shell.js matches on, and tools/validate.mjs holds it to
           that. -->
      <div id="list-body"></div>
    </section>
  </div>
</aside>

<!-- Instagram's stories, on the map. Hidden and empty until data/stories.json
     has something live in it, at which point the mark in the top left grows a
     ring and this is what opens behind it. One video at a time, full screen,
     tap to move, a bar per story along the top and the countdown to the
     moment it goes. -->
<div class="stories" id="stories" role="dialog" aria-modal="true"
     data-i18n-aria-label="storiesTitle" aria-label="Stories" hidden>
  <div class="story-stage" id="story-stage">
    <video class="story-video" id="story-video" playsinline webkit-playsinline preload="auto"></video>
    <!-- A story is a video most of the time and a photograph the rest of it.
         Two elements rather than one that changes tag: a browser keeps a
         <video> warm between stories, and swapping the element out under it
         would throw that away on every step. -->
    <img class="story-photo" id="story-photo" alt="" hidden>

    <!-- The two halves of the screen, which is how a story is walked through
         everywhere else. They are buttons and not bare divs so a keyboard and
         a screen reader get the same two moves a thumb does. -->
    <button type="button" class="story-half story-half-back" id="story-back"
            data-i18n-aria-label="storyPrev" aria-label="Previous story">
      <span class="story-chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
      </span>
    </button>
    <button type="button" class="story-half story-half-fwd" id="story-fwd"
            data-i18n-aria-label="storyNext" aria-label="Next story">
      <span class="story-chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M9 5l7 7-7 7"/></svg>
      </span>
    </button>

    <div class="story-bars" id="story-bars" aria-hidden="true"></div>

    <header class="story-head">
      <img class="story-mark" src="assets/logo/mark-round.webp" alt="" width="30" height="30">
      <p class="story-who">
        <span class="story-name" data-i18n="wordmark">Tallinn Tastebuds</span>
        <span class="story-left mono" id="story-left"></span>
      </p>
      <button type="button" class="story-btn" id="story-sound"
              data-i18n-aria-label="storyMute" aria-label="Turn the sound off">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M11 5L6.5 9H3v6h3.5L11 19z"/>
          <path class="ico-loud" d="M15 9.2a4 4 0 010 5.6M17.8 6.6a8 8 0 010 10.8"/>
          <path class="ico-hush" d="M15.5 10l5 4M20.5 10l-5 4"/>
        </svg>
      </button>
      <button type="button" class="story-btn" id="story-close"
              data-i18n-aria-label="storyClose" aria-label="Close the stories">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <footer class="story-foot">
      <p class="story-caption" id="story-caption" hidden></p>
      <a class="story-cta" id="story-cta" hidden>
        <span id="story-cta-label"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </a>
    </footer>
  </div>
</div>

<!-- The account sheet. Everything in it is built by assets/app.js, because
     which view it is showing — signed out, signed in, changing the password,
     putting an address on, confirming one, resetting a forgotten one — is
     decided at the moment it opens. -->
<div class="scrim" id="account-scrim" role="dialog" aria-modal="true"
     data-i18n-aria-label="accountTitle" aria-label="Your account" hidden>
  <div class="account card" id="account-card"></div>
</div>

<!-- How this works: a walk round the page, opened from the foot of the
     rail. A big cursor sets off from the button that was pressed and glides
     to each thing in turn — a pin, Places, the language, the filters, then
     the rail button by button, then the discount chip — a ring settles
     round it, and the mouth says what it is from a bubble beside it. The
     layer swallows the taps, so nothing being pointed at gets pressed
     mid-sentence, and a tap anywhere on it that is not the bubble is
     Next. -->
<div class="tour" id="tour" hidden>
  <div class="tour-ring" id="tour-ring" hidden></div>
  <div class="tour-cursor" id="tour-cursor" aria-hidden="true">
    <svg viewBox="0 0 32 32" focusable="false">
      <path d="M8 3l17 13.5-7.6 1.3 4.4 8.6-3.6 1.8-4.4-8.7L8 25z"/>
    </svg>
  </div>
  <div class="tour-bubble card" id="tour-bubble" role="dialog" aria-live="polite"
       data-i18n-aria-label="explainOpen" aria-label="How this works">
    <img class="tour-face" src="assets/logo/mark-round.webp" alt="" width="48" height="48">
    <p class="tour-say" id="tour-say"></p>
    <div class="tour-row">
      <button type="button" class="go" id="tour-next"></button>
      <button type="button" class="alt" id="tour-skip" data-i18n="explainSkip">Skip</button>
      <span class="tour-dots" id="tour-dots" aria-hidden="true"></span>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" data-i18n-aria-label="photos" aria-label="Photos" hidden>
  <button type="button" class="lb-btn lb-close" id="lb-close" data-i18n-aria-label="photoClose" aria-label="Close photo">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button type="button" class="lb-btn lb-prev" id="lb-prev" data-i18n-aria-label="photoPrev" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <figure class="lb-figure">
    <img id="lb-img" alt="">
    <figcaption class="mono" id="lb-caption"></figcaption>
  </figure>
  <button type="button" class="lb-btn lb-next" id="lb-next" data-i18n-aria-label="photoNext" aria-label="Next photo">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<!-- The offer to keep a list somewhere better than this browser. Shown after
     a save made while signed out, and never more than once in a visit: the
     account is worth mentioning at the moment somebody has something to lose,
     and worth shutting up about immediately afterwards. Built empty; the words
     are set by assets/app.js so they follow the language. -->
<div class="nudge" id="nudge" role="status" aria-live="polite" hidden>
  <p class="nudge-say" id="nudge-say"></p>
  <div class="nudge-row">
    <button type="button" class="nudge-go" id="nudge-go"></button>
    <button type="button" class="nudge-no" id="nudge-no"></button>
  </div>
</div>

<noscript>
  <div class="noscript card">
    <p class="eyebrow">Tallinn</p>
    <h2>Tallinn Tastebuds</h2>
    <p>This map needs JavaScript to draw itself. The full list of places lives in
      <a href="data/restaurants.json">data/restaurants.json</a>.</p>
  </div>
</noscript>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
        defer></script>
<!-- What every press reports to Google Analytics, shared by every page.
     Before the page's own script and deferred like it, so document order puts
     the global in place first. -->
<script src="assets/track.js?v=93031b0d" defer></script>
<!-- Shared with deal.html, verify.html and staff.html. The map uses only the
     lookup and date helpers from it, to work out whether a place has a
     discount worth showing; with no deals set up that answer is always no. -->
<script src="assets/pass.js?v=2e05117d" defer></script>
<!-- The basemap, shared with the lists picker and the admin one. Before
     app.js and deferred like it: deferred scripts run in document order, so
     the global is there by the time the map is drawn. -->
<script src="assets/basemap.js?v=9e9e86fa" defer></script>
<!-- The radio, shared with the lists page, which is what keeps a station
     playing when somebody walks from the map to a list. Before app.js and
     deferred like it, for the same reason as the basemap above. -->
<script src="assets/radio.js?v=f0656dd3" defer></script>
<!-- Reading a typed sentence as the wish /api/ask narrows on — which kinds
     of place, cheap or fancy, open now, near what — before the model sees a
     line of either list. It names no place itself. Before app.js and
     deferred like it, for the same reason as the basemap above. -->
<script src="assets/ask.js?v=f90b33f2" defer></script>
<!-- The eighteen glyphs, the six tones, and which of them a place draws. The
     map's own places wear the mark and nothing else can; a place off Google's
     export or one a list put on the screen wears a glyph. Before the page's
     own script and deferred like it, for the same reason as the basemap. -->
<script src="assets/pins.js?v=6030fdcf" defer></script>
<script src="assets/app.js?v=3aafd46d" defer></script>
</body>
</html>
