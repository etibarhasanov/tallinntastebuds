<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The public half of a Cloudflare Turnstile widget, which is the layer that
     stops scripts rather than people from running the save count up. Empty
     means off: assets/app.js does not load Turnstile at all, the save still
     works, and the cap in functions/api/saves.js carries it alone. Paste the
     site key here and set TURNSTILE_SECRET in the Pages project to turn it
     on — nothing else changes. -->
<meta name="turnstile-key" content="">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tallinn Tastebuds | Where to eat in Tallinn</title>
<meta name="description" content="A hand picked map of restaurants, bakeries, cafes and bars in Tallinn I have been to myself and approved. No scores: being on the map is the verdict.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7ddd4">
<meta name="robots" content="index, follow">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2XNTC15F28"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-2XNTC15F28');
</script>

<link rel="canonical" href="https://tallinntastebuds.ee/">

<meta property="og:type" content="website">
<meta property="og:url" content="https://tallinntastebuds.ee/">
<meta property="og:site_name" content="Tallinn Tastebuds">
<meta property="og:title" content="Tallinn Tastebuds | Where to eat in Tallinn">
<meta property="og:description" content="All the places in this map I have personally been and approved.">
<meta property="og:image" content="https://tallinntastebuds.ee/assets/logo/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A watercolour painting of an open, grinning mouth beside the words Tallinn Tastebuds and the line: all the places in this map I have personally been and approved.">
<meta name="twitter:card" content="summary_large_image">

<!-- The mouth, cropped square out of the painting in
     assets/logo/source-artwork.jpg. Raster all the way down: the mark is a
     watercolour, so there is no vector of it to hand a browser.

     Every side here is 16, 48 or a multiple of 48, because Google will only
     put a favicon beside a search result if it is square at a multiple of
     48px — a 32px file, which is what this list used to lead with, gets the
     grey globe instead. /favicon.ico carries the same crop at the path
     Google falls back to when it cannot read the tags at all. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/logo/icon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="assets/logo/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="assets/logo/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/logo/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Literata:opsz,wght@7..72,400..600&amp;display=swap">

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<link rel="stylesheet" href="assets/styles.css?v=e1fed8ec">
</head>
<body>

<a class="skip-link" href="#panel-list" data-i18n="skipToList">Skip to the list of places</a>

<div id="map" role="application" data-i18n-aria-label="mapLabel" aria-label="Map of approved places in Tallinn"></div>

<header class="brand" id="brand">
  <!-- No "Tallinn" eyebrow over the top: the name under it already opens with
       the word. The list panel keeps its own, where nothing else says it. -->
  <div class="brand-head">
    <img class="brand-mark" src="assets/logo/mark-round.webp" alt="" width="66" height="66">
    <h1 class="wordmark" data-i18n="wordmark">Tallinn Tastebuds</h1>
  </div>
  <p class="tagline" data-i18n="tagline">All the places in this map I have personally been and approved.</p>
  <a class="ig-link"
     href="https://www.instagram.com/tallinntastebuds/"
     target="_blank"
     rel="noopener"
     data-i18n="instagramHandle"
     data-i18n-aria-label="instagramLabel">@tallinntastebuds</a>
</header>

<div class="rail" id="rail">
  <!-- Who you are, first. Everything under it is about this visit — a place
       for tonight, a station, a colour, where you are standing — and the
       account is the one button that says the saves outlast the visit. It
       also wears a name once there is one, which is the rail telling you
       whose list you are looking at before you go looking for it.

       Hidden until /api/account says accounts are actually bound — see
       paintAccountButton in assets/app.js, which is also what holds the
       introduction below open for it. -->
  <button type="button" class="dice" id="btn-account"
          data-i18n-title="accountOpen" data-i18n-aria-label="accountOpen"
          aria-label="Account" title="Account" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="8.4" r="3.6"/>
      <path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/>
    </svg>
    <span class="dice-label rail-label" id="account-label" data-i18n="accountOpen">Account</span>
  </button>
  <!-- Then what the rail does, before what the rail looks like. Surprise me
       and the radio are the two buttons here that *do* something to the
       evening; the colour swatch and "where am I" are settings, and settings
       belong under the things they settle. On a phone that order is the whole
       point: the buttons at the top are the ones that introduce themselves
       first. -->
  <button type="button" class="dice" id="btn-random" data-i18n-title="randomPick" data-i18n-aria-label="randomPick" aria-label="Surprise me" title="Surprise me">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="4" y="4" width="16" height="16" rx="4"/>
      <circle cx="9" cy="9" r="1.35" class="pip"/>
      <circle cx="12" cy="12" r="1.35" class="pip"/>
      <circle cx="15" cy="15" r="1.35" class="pip"/>
    </svg>
    <span class="dice-label rail-label" data-i18n="randomPick">Surprise me</span>
  </button>
  <button type="button" class="dice radio" id="btn-radio" aria-pressed="false" hidden
          data-i18n-title="radioPlay" data-i18n-aria-label="radioPlay"
          aria-label="Play the radio" title="Play the radio">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="ico-play" d="M8 5.5l11 6.5-11 6.5z"/>
      <path class="ico-stop" d="M8 6.5h3v11H8zM13 6.5h3v11h-3z"/>
    </svg>
    <span class="radio-name rail-label" id="radio-name"></span>
  </button>
  <div class="styles" id="styles" role="group" data-i18n-aria-label="styleLabel" aria-label="Colour"></div>
  <div class="locate-dock card seg" id="locate-dock">
    <button type="button" class="btn btn-icon" id="btn-locate" data-i18n-aria-label="locate" aria-label="Show my location">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.2" fill="none"/><path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3"/></svg>
      <!-- Shown on a phone for the few seconds the rail spends introducing
           itself, and never on a desktop, where the hover title says it. The
           button keeps its own aria-label, so this is decoration to a reader
           rather than a second name for the same control. -->
      <span class="locate-label rail-label" data-i18n="locate" aria-hidden="true">Show my location</span>
    </button>
  </div>
</div>

<div class="controls">
  <div class="seg" id="lang-switch" role="group" data-i18n-aria-label="language" aria-label="Language"></div>
  <div class="seg">
    <button type="button" class="btn btn-wide" id="btn-list" aria-expanded="false" aria-controls="panel">
      <!-- A pin, not the magnifier that used to be here. The button says
           Places now, and a magnifier over that word offers to search
           something the button has not shown you yet. The search field is
           still the first thing inside the panel, which is where it can
           actually be used. -->
      <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 21.2c4.3-4.2 6.4-7.5 6.4-10.2a6.4 6.4 0 1 0-12.8 0c0 2.7 2.1 6 6.4 10.2z"/>
        <circle cx="12" cy="10.6" r="2.3"/>
      </svg>
      <span data-i18n="listOpen">Places</span>
    </button>
  </div>
</div>

<div class="filter-bar" id="filter-bar">
  <button type="button" class="chip filter-toggle" id="btn-filters" aria-expanded="false" aria-controls="filters">
    <svg class="filter-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M4 7h16M7 12h10M10.5 17h3"/>
    </svg>
    <span data-i18n="filtersButton">Filters</span>
  </button>
  <nav class="filters" id="filters" data-i18n-aria-label="filters" aria-label="Filter by type"></nav>
</div>

<aside class="panel card" id="panel" aria-labelledby="panel-list-title">
  <div class="sheet-grip" id="sheet-grip" role="button" tabindex="0" aria-expanded="false"
       data-i18n-aria-label="sheetResize" aria-label="Drag to resize the sheet"></div>
  <button type="button" class="panel-close" id="panel-close" data-i18n-aria-label="close" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <!-- The bookmark, and next to it how many other people have kept this place.
       Pressing it saves the place; the number says how many others saved it
       too. One action doing both jobs, which is only honest because a save
       here is anonymous — nobody can see whose it was — so the reason
       Instagram and X keep a public like apart from a private bookmark does
       not apply. In the
       panel's chrome rather than in the write-up under it: the write-up is
       rebuilt on every language switch and scrolls away, and the one thing on
       this panel you act on should do neither.

       Drawn only on a place — there is no one place to save from a list of
       seventy — which assets/app.js decides in renderPanel alongside
       everything else that turns on the view.

       A toggle keeps one name and flips aria-pressed under it; it does not
       rename itself to the opposite of what it is. The count rides in its own
       span so it can change without the label being rebuilt, and it is
       spelled into the button's label for anybody who cannot see it. -->
  <button type="button" class="panel-save" id="panel-save" aria-pressed="false"
          aria-label="Save this place" title="Save this place" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    <span class="save-n" id="panel-save-n" aria-hidden="true"></span>
  </button>
  <div class="panel-scroll" id="panel-scroll">
    <article id="panel-detail" hidden></article>
    <section id="panel-list">
      <div class="list-head">
        <p class="eyebrow" data-i18n="eyebrow">Tallinn</p>
      </div>
      <div class="search">
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/>
          </svg>
          <input type="search" class="search-input" id="list-search" autocomplete="off"
                 autocorrect="off" autocapitalize="none" spellcheck="false"
                 data-i18n-aria-label="search" data-i18n-placeholder="searchPlaceholder"
                 aria-label="Search places" placeholder="Name, street or dish">
          <button type="button" class="search-clear" id="search-clear"
                  data-i18n-aria-label="searchClear" aria-label="Clear the search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
      <div id="list-body"></div>
    </section>
  </div>
</aside>

<!-- Instagram's stories, on the map. Hidden and empty until data/stories.json
     has something live in it, at which point the mark in the top left grows a
     ring and this is what opens behind it. One video at a time, full screen,
     tap to move, a bar per story along the top and the countdown to the
     moment it goes. -->
<div class="stories" id="stories" role="dialog" aria-modal="true"
     data-i18n-aria-label="storiesTitle" aria-label="Stories" hidden>
  <div class="story-stage" id="story-stage">
    <video class="story-video" id="story-video" playsinline webkit-playsinline preload="auto"></video>
    <!-- A story is a video most of the time and a photograph the rest of it.
         Two elements rather than one that changes tag: a browser keeps a
         <video> warm between stories, and swapping the element out under it
         would throw that away on every step. -->
    <img class="story-photo" id="story-photo" alt="" hidden>

    <!-- The two halves of the screen, which is how a story is walked through
         everywhere else. They are buttons and not bare divs so a keyboard and
         a screen reader get the same two moves a thumb does. -->
    <button type="button" class="story-half story-half-back" id="story-back"
            data-i18n-aria-label="storyPrev" aria-label="Previous story">
      <span class="story-chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
      </span>
    </button>
    <button type="button" class="story-half story-half-fwd" id="story-fwd"
            data-i18n-aria-label="storyNext" aria-label="Next story">
      <span class="story-chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M9 5l7 7-7 7"/></svg>
      </span>
    </button>

    <div class="story-bars" id="story-bars" aria-hidden="true"></div>

    <header class="story-head">
      <img class="story-mark" src="assets/logo/mark-round.webp" alt="" width="30" height="30">
      <p class="story-who">
        <span class="story-name" data-i18n="wordmark">Tallinn Tastebuds</span>
        <span class="story-left mono" id="story-left"></span>
      </p>
      <button type="button" class="story-btn" id="story-sound"
              data-i18n-aria-label="storyMute" aria-label="Turn the sound off">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M11 5L6.5 9H3v6h3.5L11 19z"/>
          <path class="ico-loud" d="M15 9.2a4 4 0 010 5.6M17.8 6.6a8 8 0 010 10.8"/>
          <path class="ico-hush" d="M15.5 10l5 4M20.5 10l-5 4"/>
        </svg>
      </button>
      <button type="button" class="story-btn" id="story-close"
              data-i18n-aria-label="storyClose" aria-label="Close the stories">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <footer class="story-foot">
      <p class="story-caption" id="story-caption" hidden></p>
      <a class="story-cta" id="story-cta" hidden>
        <span id="story-cta-label"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </a>
    </footer>
  </div>
</div>

<!-- The account sheet. Everything in it is built by assets/app.js, because
     which view it is showing — signed out, signed in, changing the password,
     putting an address on, confirming one, resetting a forgotten one — is
     decided at the moment it opens. -->
<div class="scrim" id="account-scrim" role="dialog" aria-modal="true"
     data-i18n-aria-label="accountTitle" aria-label="Your account" hidden>
  <div class="account card" id="account-card"></div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" data-i18n-aria-label="photos" aria-label="Photos" hidden>
  <button type="button" class="lb-btn lb-close" id="lb-close" data-i18n-aria-label="photoClose" aria-label="Close photo">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button type="button" class="lb-btn lb-prev" id="lb-prev" data-i18n-aria-label="photoPrev" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <figure class="lb-figure">
    <img id="lb-img" alt="">
    <figcaption class="mono" id="lb-caption"></figcaption>
  </figure>
  <button type="button" class="lb-btn lb-next" id="lb-next" data-i18n-aria-label="photoNext" aria-label="Next photo">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</div>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<!-- The offer to keep a list somewhere better than this browser. Shown after
     a save made while signed out, and never more than once in a visit: the
     account is worth mentioning at the moment somebody has something to lose,
     and worth shutting up about immediately afterwards. Built empty; the words
     are set by assets/app.js so they follow the language. -->
<div class="nudge" id="nudge" role="status" aria-live="polite" hidden>
  <p class="nudge-say" id="nudge-say"></p>
  <div class="nudge-row">
    <button type="button" class="nudge-go" id="nudge-go"></button>
    <button type="button" class="nudge-no" id="nudge-no"></button>
  </div>
</div>

<noscript>
  <div class="noscript card">
    <p class="eyebrow">Tallinn</p>
    <h2>Tallinn Tastebuds</h2>
    <p>This map needs JavaScript to draw itself. The full list of places lives in
      <a href="data/restaurants.json">data/restaurants.json</a>.</p>
  </div>
</noscript>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
        defer></script>
<!-- Shared with deal.html, verify.html and staff.html. The map uses only the
     lookup and date helpers from it, to work out whether a place has a
     discount worth showing; with no deals set up that answer is always no. -->
<script src="assets/pass.js?v=9dfcb42e" defer></script>
<!-- The basemap, shared with the lists picker and the admin one. Before
     app.js and deferred like it: deferred scripts run in document order, so
     the global is there by the time the map is drawn. -->
<script src="assets/basemap.js?v=bf2dd374" defer></script>
<script src="assets/app.js?v=45b384b0" defer></script>
</body>
</html>
