<!-- Everything between the markers is swapped by functions/split.js for the
     tags of whichever group ?g= names, so a link pasted into a message arrives
     as "Split in Berlin" and the mark, rather than as the site's own name or a
     bare blue URL. What is written here is what the front door gets — no ?g=,
     nothing to unfurl — and what a group falls back to if that route cannot
     answer.

     Noindex either way, and that is not a contradiction: being fetched is what
     builds the card, being indexed is what puts the page in a search result,
     and this wants the first without the second. robots.txt deliberately does
     NOT disallow /split, because a Disallow stops the fetch and a stopped
     fetch is a bare blue URL — the same reasoning /list/<id> has carried since
     lists became shareable. It is not in sitemap.xml. -->
<!--PAGE-HEAD-->
<title>Splitwise | Tallinn Tastebuds</title>
<meta name="description" content="Dinner for five and one card at the table. Put in what everybody paid, and this says who hands what to whom.">
<meta name="robots" content="noindex, nofollow">
<!--/PAGE-HEAD-->

<!-- The tokens, the card, the eyebrow and the controls come from the map's
     stylesheet; the brand header, the stack, the cards and the fields come
     from the lists page's, exactly as the account page takes them. The third
     is this page's own, and it is short: a column of money, the people a bill
     is split between, and the line that says who owes whom. Nothing else here
     is new furniture. -->
<link rel="stylesheet" href="/assets/styles.css?v=39f196f3">
<link rel="stylesheet" href="/assets/lists.css?v=21b032a2">
<link rel="stylesheet" href="/assets/split.css?v=5cc33ddb">
</head>
<body class="lists-body">

<a class="skip-link" href="#main" data-i18n="splitSkip">Skip to your groups</a>

<header class="lists-brand">
  <!-- Home is the map, and where the map is depends on which hostname this
       is: at the root of tallinntastebuds.ee and of every preview, and one
       domain up from splitwise.tallinntastebuds.ee, where the root is this
       page. The site's own spelling is here so the header is right with no
       script at all; assets/split.js rewrites it on the subdomain. -->
  <a class="lists-home" id="brand-home" href="/" data-track="home" data-i18n-aria-label="listsBack" aria-label="Back to the map">
    <img class="lists-mark" src="/assets/logo/mark-round.webp" alt="" width="40" height="40">
    <span class="lists-wordmark" data-i18n="wordmark">Tallinn Tastebuds</span>
  </a>
</header>

<!-- Signed in, signed out, invited, and switched off: all four are built by
     assets/split.js into this one element, decided once when every answer is
     in. Nothing in the markup depends on which of them it is, so nothing can
     be left standing from a state the page is no longer in. -->
<main class="lists-main" id="main" tabindex="-1"></main>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<noscript>
  <div class="noscript card">
    <p class="eyebrow">Splitwise</p>
    <h2>Split the bill</h2>
    <p>This page is your groups and what everybody in them paid, which takes
      JavaScript to draw. The map itself works rather better than this page
      does without it — <a href="/">it is over here</a>.</p>
  </div>
</noscript>

<!-- What every press reports to Google Analytics, shared by every page.
     Before the page's own script and deferred like it, so document order puts
     the global in place first. -->
<script src="/assets/track.js?v=93031b0d" defer></script>
<script src="/assets/split.js?v=cca5ac15" defer></script>
</body>
