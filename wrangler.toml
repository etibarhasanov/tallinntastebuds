# Tallinn Tastebuds — Cloudflare Pages configuration.
#
# The site is still static files: this exists only so the /api/likes Function
# has a database to talk to, and so `wrangler pages dev` can run the same
# binding locally that production uses.
#
# The two secrets this needs are NOT here and must never be. Set them in the
# Pages project (Settings → Variables and Secrets), as encrypted secrets:
#
#   LIKE_SALT          any long random string. Salts the IP fingerprints, so
#                      changing it later makes every existing fingerprint
#                      unmatchable — the cap resets, the counts do not.
#   TURNSTILE_SECRET   optional. The secret half of a Turnstile widget. With
#                      it unset the bot check is skipped and the rest of the
#                      feature works unchanged.
name = "tallinntastebuds"
pages_build_output_dir = "."
compatibility_date = "2026-09-02"

[[d1_databases]]
binding = "DB"
database_name = "tallinntastebuds"
database_id = "3eb14127-0ef6-4935-954b-e0a593d465ba"
