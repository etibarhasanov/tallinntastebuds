# Tallinn Tastebuds — Cloudflare Pages configuration.
#
# The site is still static files: this exists only so the /api/saves Function
# has a database to talk to, and so `wrangler pages dev` can run the same
# binding locally that production uses.
#
# The secrets are NOT here and must never be. Set them in the Pages project
# under Settings → Variables and Secrets:
#
#   SAVE_SALT          SECRET, required. Any long random string. Salts the IP
#                      fingerprints, so changing it later makes every existing
#                      fingerprint unmatchable — the cap resets, the counts do
#                      not. Saving and accounts both refuse to write without it.
#
#   TURNSTILE_SECRET   SECRET, optional. The secret half of a Turnstile widget.
#                      Unset, the bot check is skipped and the rest works
#                      unchanged.
#
#   CF_ACCOUNT_ID      text     ) optional, and only for password-reset email,
#   CF_EMAIL_TOKEN     SECRET   ) through Cloudflare's own Email Service. All
#   MAIL_FROM          text     ) three must be set before the sign-up sheet
#                      offers an address field at all: a field that collects an
#                      address the site cannot send a code to would leave
#                      somebody believing they have a way back in. The token
#                      needs the "Email Sending: Edit" permission, and the
#                      domain in MAIL_FROM has to be onboarded under Email
#                      Service → Email Sending. See the README.
name = "tallinntastebuds"
pages_build_output_dir = "."
compatibility_date = "2026-09-02"

[[d1_databases]]
binding = "DB"
database_name = "tallinntastebuds"
database_id = "3eb14127-0ef6-4935-954b-e0a593d465ba"
