# Tallinn Tastebuds — Cloudflare Pages configuration.
#
# The site is still static files: this exists only so the /api Functions have
# a database to talk to, and so `wrangler pages dev` can run the same bindings
# locally that a deployment does.
#
# TWO DATABASES, AND WHY
#
# Pages gives a project two environments. Production is whatever is deployed
# from the production branch and serves tallinntastebuds.ee; preview is every
# other deployment — a pull request, a branch you pushed to look at, a
# `wrangler pages deploy` from a laptop — and each gets its own URL under
# *.tallinntastebuds.pages.dev.
#
# They used to share one D1 database, because the binding was declared once at
# the top level and Pages hands the top level to both. So a save pressed on a
# preview URL while checking a change landed in the live counts, a test account
# was a real account, and the live database's row counts were part test data
# with no way to tell which rows were which. That is what the split below
# fixes: production talks to `tallinntastebuds`, everything else talks to
# `tallinntastebuds-preview`, and the two never see each other's rows.
#
# Pages only allows these two environment names — there is no [env.staging] —
# and `wrangler pages deploy --branch <name>` picks between them by whether
# <name> is the project's production branch. The preview block is written once
# and applies to every preview deployment; Pages has no per-branch config.
#
# Both blocks must list every binding they use. Pages does not inherit
# bindings or vars from the top level once an environment overrides any of
# them, so d1_databases and vars are repeated in full in each — an omission
# there is not a fallback, it is a missing binding.
#
# The top level is what `wrangler pages dev` reads, and it points at the
# preview database on purpose: a local session that reaches for the remote
# database should reach for the one it is allowed to break.
#
# tools/validate.mjs checks all of this on every push — that the two
# environments name different databases, and that each says which one it is —
# so the two ids cannot quietly drift back into being the same id again.
#
# The secrets are NOT here and must never be. Set them in the Pages project
# under Settings → Variables and Secrets — and note that they are
# per-environment too: the Production / Preview switch at the top of that page
# is not decoration, and a secret added to one is simply absent in the other.
#
#   SAVE_SALT          SECRET, required. Any long random string. Salts the IP
#                      fingerprints, so changing it later makes every existing
#                      fingerprint unmatchable — the cap resets, the counts do
#                      not. Saving and accounts both refuse to write without it.
#                      Set it in both environments, with different values —
#                      there is nothing to gain from fingerprints being
#                      comparable across the two.
#
#   TURNSTILE_SECRET   SECRET, optional. The secret half of a Turnstile widget.
#                      Unset, the bot check is skipped and the rest works
#                      unchanged.
#
#   GOOGLE_CLIENT_ID   SECRET, optional. The OAuth client from the Google
#   GOOGLE_CLIENT_SECRET  SECRET, optional. Cloud console, for Continue with
#                      Google. Both or neither: /api/account reports Google as
#                      unavailable unless it has the pair, and the sheets draw
#                      no button. Nothing else changes — a username and a
#                      password is still the whole of an account without them.
#
#                      Whitespace on either is trimmed, and the id must end in
#                      .apps.googleusercontent.com and be made only of
#                      letters, digits, dots, hyphens and underscores, or the
#                      pair counts as absent and no button is drawn. Both are
#                      pasted into boxes that cannot be read back, so a
#                      trailing newline, a zero-width character in the middle,
#                      or the secret in the id's box is otherwise invisible
#                      until Google answers "the OAuth client was not found".
#                      googleReady() in functions/api/_google.js is the check,
#                      and **Turning it on** in README.md has the one curl
#                      that says which of the two a silent button is — and
#                      what it means when the id is clean and Google still
#                      cannot find the client, which is a console problem and
#                      not a binding one.
#
#                      BOTH AS SECRETS, INCLUDING THE ID, AND NOT BY TASTE
#
#                      A client id is public — it travels in the redirect URL
#                      and anyone who presses the button can read it — so on
#                      most projects it would be an ordinary plaintext
#                      variable. Not on this one. The moment a Pages project
#                      has a wrangler file, that file is the source of truth
#                      for everything it can declare, and [vars] is one of
#                      those things: a plaintext variable typed into the
#                      dashboard is not editable there and does not reach a
#                      deployment. The dashboard still owns secrets, because a
#                      secret is the one binding that must never be in the
#                      repository. So secrets is what both of these are, and
#                      the only cost is that the id cannot be read back off
#                      the page after it is saved.
#
#                      The other way round works too and is a code change
#                      rather than a dashboard one: put GOOGLE_CLIENT_ID in
#                      the [env.production.vars] and [env.preview.vars] blocks
#                      below, where it would be committed, and leave only the
#                      secret in the dashboard. Nothing in the Functions cares
#                      — both arrive on `env` and googleReady() in
#                      functions/api/_google.js reads them the same way.
#
#                      Per-environment like the rest, and in the Google console
#                      the *redirect URI* is per-hostname besides: register
#                      https://tallinntastebuds.ee/api/google and
#                      https://splitwise.tallinntastebuds.ee/api/google for
#                      production, and the preview host you actually open for
#                      preview. Google matches them exactly and accepts no
#                      wildcard, so a new preview branch is a new URI — which
#                      is the one part of this that cannot be made to look
#                      after itself. See **Signing in with Google** in
#                      README.md.
#
# There were three more — CF_ACCOUNT_ID, CF_EMAIL_TOKEN and MAIL_FROM — for a
# password reset by email. Nothing reads them any more, so if they are set in
# either environment they can be deleted from the Pages project.
#
# THE AI BINDING
#
# [ai] below is what /api/ask puts a question to, and it is not a secret and
# not a key: Workers AI is bound the way D1 is, by name, and the account it
# runs against is the account the Pages project is already in. Ten thousand
# Neurons a day come free with every account, which is a great many questions
# at a few hundred tokens each, and on the Workers Free plan going past the
# allowance fails the request rather than billing for it.
#
# It is repeated in each environment for the same reason the database is —
# Pages inherits nothing from the top level once an environment overrides
# anything — but unlike the database the two may name the same thing, because
# there are no rows to keep apart. A preview asking a question and a
# production one asking the same question both spend from the same daily
# allowance, and neither can write anything the other reads.
#
# Unlike D1 there is nothing to create first: the binding works the moment a
# deployment carries it. Without it /api/ask still answers — with the opening
# hours and no opinion — and the chat says nothing answers rather than
# guessing. So this is the one binding in this file whose absence is a
# quieter feature rather than a broken route.
#
# What the allowance actually buys is worth knowing before relying on it:
# something like two hundred and fifty questions a day on the model named in
# functions/api/ask.js, and past that every request is a 429 until midnight
# UTC and the chat says it is resting. Preview and production spend from the
# same daily pot, so an afternoon of testing against a preview empties the
# live site's allowance too. /api/ask reports whether the model answered in
# `note` and which model in `model`, so both are visible from outside rather
# than guessed at; the comment above MODEL in that file has the arithmetic
# and the one curl that reads them.
name = "tallinntastebuds"
pages_build_output_dir = "."
compatibility_date = "2026-09-02"

# ------------------------------------------------------------------- local
[[d1_databases]]
binding = "DB"
database_name = "tallinntastebuds-preview"
database_id = "3dd762d3-1d31-4e54-9f12-a3c0ad93dbca"

[ai]
binding = "AI"

[vars]
# Which half of the split this deployment believes it is. Compared against the
# database's own meta row by functions/api/_lib.js, so a binding pointed at
# the wrong database shuts the API off instead of writing to it.
ENVIRONMENT = "preview"

# ----------------------------------------------------------------- preview
# Every deployment that is not from the production branch.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "tallinntastebuds-preview"
database_id = "3dd762d3-1d31-4e54-9f12-a3c0ad93dbca"

[env.preview.ai]
binding = "AI"

[env.preview.vars]
ENVIRONMENT = "preview"

# -------------------------------------------------------------- production
# tallinntastebuds.ee, and the only database anybody would miss.
[[env.production.d1_databases]]
binding = "DB"
database_name = "tallinntastebuds"
database_id = "3eb14127-0ef6-4935-954b-e0a593d465ba"

[env.production.ai]
binding = "AI"

[env.production.vars]
ENVIRONMENT = "production"
