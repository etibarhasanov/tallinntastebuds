     counted by the site — assets/track.js sends nothing from /admin/ — but
     Google still hears about them until its tag comes out. -->
<script src="/assets/analytics.js?v=a44b6b90" defer></script>

<!-- Not indexed and not disallowed, for the reasons admin/stats.html gives:
     a crawler forbidden to fetch the page could not read this tag. -->

<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/assets/logo/icon-48.png" type="image/png" sizes="48x48">

<link rel="icon" href="/assets/logo/icon-192.png" type="image/png" sizes="192x192">

<link rel="stylesheet" href="/assets/styles.css?v=a4472bd9">

    <span class="lists-wordmark" data-i18n="wordmark">Tallinn Tastebuds</span>

<!-- The title and the sentence under it are in the markup, so the page says
     what it is before the numbers arrive and still says it if they never do.
     Everything else is the one element assets/visitors.js fills. -->

  <p class="eyebrow" data-i18n="eyebrow">Tallinn</p>

  <p class="stats-lead" data-i18n="visitorsLead">Counted on this site, with no cookies. A visitor is a browser on a day, a returning one had been here on an earlier day, and nothing here says who anybody is.</p>
</div>

  <div class="noscript card">
    <p class="eyebrow">Tallinn</p>
