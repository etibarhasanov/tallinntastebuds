<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7ddd4">
<title>Not found | Tallinn Tastebuds</title>

<!-- Cloudflare Pages serves this file, with a 404, at every address nothing
     else answers — a mistyped link, an old one, a robot asking for a file the
     site has never had. Before it existed Pages answered all of those with the
     map and a 200, which told a search engine every typo was a page worth
     keeping. functions/_middleware.js serves it as well for the addresses it
     turns away itself: the retired /stats and /google, and everything under
     /admin/ to anybody but the owner, so those look exactly like any other
     address that is not there. **Not found** in README.md.

     Every address in it is written from the root, because it is read at any
     depth: a relative "assets/…" at /u/a/b would ask for /u/a/assets/…. -->
<meta name="robots" content="noindex, follow">

<!-- Analytics: Google and Microsoft Clarity, both from one file rather than
     two snippets pasted into every head. assets/analytics.js holds the ids and
     the consentv2 signal Clarity needs. -->
<script src="/assets/analytics.js?v=ff6f3c33" defer></script>

<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/assets/logo/icon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="/assets/logo/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="/assets/logo/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/logo/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Literata:opsz,wght@7..72,400..600&amp;display=swap">

<!-- The tokens, the card, the eyebrow and the two buttons from the map's
     stylesheet; the brand header, the column and the card's lines from the
     lists page's. Nothing of its own but the line that prints the address. -->
<link rel="stylesheet" href="/assets/styles.css?v=07d3f854">
<link rel="stylesheet" href="/assets/lists.css?v=f739cb79">
</head>
<body class="lists-body">

<a class="skip-link" href="#main" data-i18n="notFoundSkip">Skip to the page</a>

<header class="lists-brand">
  <a class="lists-home" href="/" data-track="home" data-i18n-aria-label="backToMap" aria-label="Back to the map">
    <img class="lists-mark" src="/assets/logo/mark-round.webp" alt="" width="40" height="40">
    <span class="lists-wordmark" data-i18n="wordmark">Tallinn Tastebuds</span>
  </a>
</header>

<!-- The whole page is in the markup, in English, and assets/notfound.js only
     puts it into the reader's language and fills in the address. So it says
     the same thing with scripts off, and the two ways on are real links. -->
<main class="lists-main" id="main" tabindex="-1">
  <section class="card lists-card">
    <p class="eyebrow">404</p>
    <h1 class="lists-title" data-i18n="notFoundTitle">Nothing at this address</h1>
    <p class="notfound-at" id="notfound-at" hidden></p>
    <p class="lists-say" data-i18n="notFoundLead">The page may have moved, or the link was cut short on the way here. The map is where it always was.</p>
    <p class="lists-row lists-foot">
      <a class="go" href="/" data-track="home" data-i18n="backToMap">Back to the map</a>
      <a class="alt" href="/lists" data-track="notfound_lists" data-i18n="listsAllTitle">Everybody’s lists</a>
    </p>
  </section>
</main>

<!-- data-page because this page is read at whatever address was asked for,
     and the site's own count knows it by /404 — PAGE in assets/track.js. -->
<script src="/assets/track.js?v=0f341e36" data-page="/404" defer></script>
<script src="/assets/notfound.js?v=172081fb" defer></script>
</body>
</html>
