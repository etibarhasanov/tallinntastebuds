<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- functions/azeri.js swaps what is between these two markers for the
     head of the address that was asked for — the language, the canonical,
     the card a link unfurls as and, at the home, the questions as an
     FAQPage. What stands here is what the file says when that Function
     cannot read it. The corner is open to anybody and meant to be found,
     so nothing here keeps it out of an index any more; it was for members,
     and said noindex, until 2026-11-21. -->
<!--PAGE-HEAD-->
<title>An Azerbaijani corner in Estonia | Tallinn Tastebuds</title>
<!--/PAGE-HEAD-->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7ddd4">
<!-- Analytics: Microsoft Clarity, from one file rather than a snippet
     pasted into every head. assets/analytics.js holds the id and the
     consentv2 signal Clarity needs, and its head carries the reasoning of the
     consent bar that stood in front of it for a day. -->
<script src="/assets/analytics.js?v=7d35c109" defer></script>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/assets/logo/icon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="/assets/logo/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="/assets/logo/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/logo/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..700&amp;display=swap">
<!-- The tokens, the card and the language switch from the map's stylesheet,
     the page frame and the field from the lists page's, and the shelf itself
     — the tabs, the chips, the rows — from its own. -->
<link rel="stylesheet" href="/assets/styles.lean.css?v=4f81ed66">
<link rel="stylesheet" href="/assets/lists.lean.css?v=e7381579">
<link rel="stylesheet" href="/assets/azeri.css?v=c74aabf8">
</head>
<body class="lists-body azeri-body">

<a class="skip-link" href="#main" data-i18n="azeriSkipTopics">Skip to the topics</a>

<header class="lists-brand">
  <a class="lists-home" href="/" data-track="home" data-i18n-aria-label="backToMap" aria-label="Back to the map">
    <img class="lists-mark" src="/assets/logo/mark-round.webp" alt="" width="40" height="40">
    <!-- The corner's own name where every other page writes the site's, and
         the site under it as a byline: the page is read as a place of its
         own, and the mark still says whose. -->
    <span class="azeri-brand">
      <span class="lists-wordmark" data-i18n="azeriCorner">Azerbaijani Corner</span>
      <span class="azeri-by" data-i18n="azeriBy">by Tallinn Tastebuds</span>
    </span>
  </a>
  <!-- Four languages and no more: the page is read in Azerbaijani, English,
       Russian or Estonian, the four its guide is written in, whatever the
       rest of the site is in. Drawn by assets/language.js out of the names
       data/lang/index.json has for them. -->
  <div class="seg lang-surface" id="lang-switch" role="group"
       data-i18n-aria-label="language" aria-label="Language"></div>
</header>

<main class="lists-main" id="main" tabindex="-1">
  <!-- The corner's name beside the mark is the page's title to the eye, so
       the tabs come straight under it; this says it once more for a screen
       reader, which looks for the page's heading. -->
  <h1 class="azeri-said" data-i18n="azeriCorner">Azerbaijani Corner</h1>
  <!-- The tabs: the home, the country's films, the posts people write, a
       guide to living in Estonia for somebody arriving from there, and the
       Azerbaijani places here on a map. Each is an address, so they are
       links — one opens in a new tab, and is what gets copied — but a press
       is caught by assets/azeri.js, which draws the tab under them without
       loading the page again, and says which one is on. -->
  <nav class="azeri-tabs" data-i18n-aria-label="azeriTitle" aria-label="An Azerbaijani corner in Estonia">
    <a class="azeri-tab" href="/azeri" data-tab="home" data-track="azeri_home" data-i18n="azeriHome">Home</a>
    <a class="azeri-tab" href="/azeri?tab=films" data-tab="films" data-track="azeri_films" data-i18n="azeriFilms">Azerbaijani films</a>
    <a class="azeri-tab" href="/azeri?tab=community" data-tab="community" data-track="azeri_community" data-i18n="azeriCommunity">Posts</a>
    <a class="azeri-tab" href="/azeri?tab=estonia" data-tab="estonia" data-track="azeri_estonia" data-i18n="azeriEstonia">Estonia</a>
    <a class="azeri-tab" href="/azeri?tab=study" data-tab="study" data-track="azeri_study" data-i18n="azeriStudy">Studying</a>
    <a class="azeri-tab" href="/azeri?tab=estonian" data-tab="estonian" data-track="azeri_estonian" data-i18n="azeriEstonian">Estonian</a>
    <a class="azeri-tab" href="/azeri?tab=food" data-tab="food" data-track="azeri_food" data-i18n="azeriPlaces">Azerbaijani places</a>
  </nav>
  <!-- Everything under the tabs — the home, the search, the chips and the
       films, the posts and a post's comments, the topics of the guide, or
       the places' map — is built by assets/azeri.js once the page's words
       are in, and the route has answered where the tab asks one, so nothing
       from the state before is left standing. At the home,
       functions/azeri.js writes the home into it as text first, for the
       reader that runs no script; the script empties it before it draws. -->
  <div id="shelf"></div>
</main>

<noscript>
  <div class="noscript card">
    <p class="eyebrow">Tallinn Tastebuds</p>
    <h2>An Azerbaijani corner in Estonia</h2>
    <p>The films, the guide and the places are drawn by a script. The map
      itself works rather better without one — <a href="/">it is over
      here</a>.</p>
  </div>
</noscript>

<!-- What every press reports, to Clarity and to the site's own count,
     shared by every page.
     Before the page's own script and deferred like it, so document order puts
     the global in place first. -->
<script src="/assets/track.js?v=34c2e65a" defer></script>
<!-- A swipe to the right is Back. After track.js, since it reports the press;
     before the page's own script and deferred like it. -->
<script src="/assets/back.js?v=9d9a7dd8" defer></script>
<!-- The language switch, a global for the page's own script to use. -->
<script src="/assets/language.js?v=fcaf98e0" defer></script>
<script src="/assets/azeri.js?v=a2f71a08" defer></script>
</body>
</html>
