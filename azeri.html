<body class="lists-body azeri-body">

<a class="skip-link" href="#main" data-i18n="azeriSkip">Skip to the films</a>

<header class="lists-brand">

    <img class="lists-mark" src="/assets/logo/mark-round.webp" alt="" width="40" height="40">
    <span class="lists-wordmark" data-i18n="wordmark">Tallinn Tastebuds</span>
  </a>
  <!-- Four languages and no more: the page is read in Azerbaijani, English,
       Russian or Estonian, the four its guide is written in, whatever the
       rest of the site is in. Drawn by assets/language.js out of the names
       data/lang/index.json has for them. -->
  <div class="seg lang-surface" id="lang-switch" role="group"
       data-i18n-aria-label="language" aria-label="Language"></div>
</header>

<main class="lists-main" id="main" tabindex="-1">
  <div class="azeri-head">
    <p class="eyebrow" data-i18n="azeriEyebrow">For members</p>

    <p class="lists-say" data-i18n="azeriLead">A corner about Azerbaijan, and about living in Estonia.</p>
  </div>
  <!-- The tabs: the country's films, and a guide to living in Estonia for
       somebody arriving from there. Each is an address, so they are links;
       which one is on is said by assets/azeri.js, from the address. -->
  <nav class="azeri-tabs" data-i18n-aria-label="azeriTitle" aria-label="Azerbaijan">
    <a class="azeri-tab" href="/azeri" data-tab="films" data-track="azeri_films" data-i18n="azeriFilms">Films</a>

  </nav>
  <!-- Everything under the tabs — the door when nobody is signed in, the
       search, the chips and the films, or the topics of the guide — is built
       by assets/azeri.js once /api/azeri has answered, so nothing from the
       state before is left standing. -->
  <div id="shelf"></div>
</main>
