<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your posts | Tallinn Tastebuds</title>
<meta name="description" content="Write a post for the blog: about the places you love in Tallinn, in any of the site's languages.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7ddd4">

<!-- Analytics: Microsoft Clarity, from one file. The same tag
     account.html carries, written from the root for the same reason. A draft
     is somebody's writing before they chose to show it, so the editor box is
     masked from the replays — see data-clarity-mask in assets/write.js. -->
<script src="/assets/analytics.js?v=43d1c258" defer></script>

<!-- One person's own desk, behind a session cookie, the same as the account
     page it is a door off: nothing to unfurl, nothing to index. What gets
     indexed is the post once it is published, at /blog?post=<id>. _headers
     carries the noindex to match, and it is not in sitemap.xml. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/assets/logo/icon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="/assets/logo/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="/assets/logo/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/logo/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Literata:opsz,wght@7..72,400..600&amp;display=swap">

<!-- The map's tokens and controls, the lists page's furniture — the header,
     the card, the field — and the blog's prose, because the box a post is
     written in is set in the type it will be read in: what the writer sees
     is the post. The fourth file is the desk itself: the toolbar, the
     language tabs and the place picker. -->
<link rel="stylesheet" href="/assets/styles.lean.css?v=8fbf7673">
<link rel="stylesheet" href="/assets/lists.lean.css?v=201a6f4e">
<link rel="stylesheet" href="/assets/blog.css?v=c9fc5b88">
<link rel="stylesheet" href="/assets/write.css?v=f7e7c3e6">
</head>
<body class="lists-body">

<a class="skip-link" href="#main" data-i18n="writeSkip">Skip to the editor</a>

<header class="lists-brand">
  <a class="lists-home" href="/" data-track="home" data-i18n-aria-label="backToMap" aria-label="Back to the map">
    <img class="lists-mark" src="/assets/logo/mark-round.webp" alt="" width="40" height="40">
    <span class="lists-wordmark" data-i18n="wordmark">Tallinn Tastebuds</span>
  </a>
  <!-- The blog as everybody reads it. -->
  <a class="lists-who" href="/blog" data-track="write_blog" data-i18n="blogTitle">Notes on the map</a>
</header>

<!-- Your posts, one post open in the editor, signed out, and accounts
     switched off are all built by assets/write.js into this one element,
     once every answer is in. -->
<main class="lists-main" id="main" tabindex="-1"></main>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<noscript>
  <div class="noscript card">
    <p class="eyebrow">Your posts</p>
    <h2>Your posts</h2>
    <p>This page is an editor, and an editor takes JavaScript. The map works
      rather better than this page does without it — <a href="/">it is over
      here</a>.</p>
  </div>
</noscript>

<!-- What every press reports, shared by every page. Before the page's own
     script and deferred like it, so document order puts the global in place
     first. -->
<script src="/assets/track.js?v=861e366a" defer></script>
<!-- A swipe to the right is Back, from wherever the thumb lands rather than
     from the edge of the glass alone. After track.js, since it reports the
     press; before the page's own script and deferred like it. -->
<script src="/assets/back.js?v=bd40e788" defer></script>
<script src="/assets/write.js?v=266d8eb0" defer></script>
</body>
</html>
